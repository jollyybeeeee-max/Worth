<style>
:root{
  color-scheme: light;
  --bg:#F5F5F3; --card:#FFF; --line:#EBEAE7; --ink:#2B2B2C; --inkMid:#6B6D6C;
  --inkSoft:#A0A19F; --accent:#5D9884; --accentSoft:#E7EFEC; --pastel:#DCE9E3;
  --up:#5D9884; --down:#BF7266; --overlay:rgba(43,43,44,.42);
}
html[data-theme="dark"]{
  color-scheme: dark;
  --bg:#15171A; --card:#1E2125; --line:#2C3035; --ink:#E8E9EA; --inkMid:#A2A6AB;
  --inkSoft:#71767C; --accent:#6FB09A; --accentSoft:#25352F; --pastel:#22302B;
  --up:#6FB09A; --down:#D08578; --overlay:rgba(0,0,0,.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);forced-color-adjust:none;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color:var(--ink);-webkit-text-size-adjust:100%;
  word-break:keep-all;overflow-wrap:break-word;letter-spacing:-.01em}
body{padding-bottom:env(safe-area-inset-bottom)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.wrap{max-width:520px;margin:0 auto;padding:0 16px 104px}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:18px 0 14px}
.logo{font-size:22px;font-weight:800;letter-spacing:-.04em}
.logo span{color:var(--accent)}
.hbtns{display:flex;align-items:center;gap:7px}
.ib{position:relative;width:34px;height:34px;border-radius:11px;background:var(--card);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--inkMid)}
.pb{height:34px;border-radius:11px;background:var(--accent);color:#fff;display:flex;align-items:center;
  gap:4px;padding:0 13px 0 10px;font-size:12.5px;font-weight:700}
.hero{background:var(--pastel);border-radius:22px;padding:20px}
.hero .lbl{font-size:11.5px;font-weight:700;color:var(--inkMid)}
.hero .big{font-size:32px;font-weight:800;letter-spacing:-.04em;margin-top:6px;line-height:1.1}
.hero .big small{font-size:19px;font-weight:700}
.row3{display:flex;gap:20px;margin-top:18px;padding-top:16px;border-top:1px solid rgba(93,152,132,.25)}
.row3 .k{font-size:11px;font-weight:600;color:var(--inkMid)}
.row3 .v{font-size:15.5px;font-weight:700;margin-top:3px}
.nav{display:flex;align-items:center;gap:12px;justify-content:center;margin:14px 0}
.nav b{font-size:14px;font-weight:700;min-width:96px;text-align:center}
.nav button{width:30px;height:30px;border-radius:999px;background:var(--card);
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--accent)}
.seg{display:flex;gap:4px;background:var(--card);border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{flex:1;padding:9px 0;border-radius:9px;font-size:13.5px;font-weight:700;color:var(--inkSoft)}
.seg button.on{background:var(--accent);color:#fff}
.card{background:var(--card);border-radius:20px;padding:18px;margin-bottom:12px}
.ttl{font-size:13px;font-weight:800;margin-bottom:14px;letter-spacing:-.02em}
.daygrp{margin-top:16px}
.dayhd{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 7px;
  font-size:12.5px;font-weight:700;color:var(--inkMid)}
.list{background:var(--card);border-radius:18px;padding:0 14px}
.tx{display:flex;align-items:center;gap:11;border-bottom:1px solid var(--line);gap:11px}
.tx:last-child{border-bottom:none}
.tx .main{flex:1;min-width:0;display:flex;align-items:center;gap:11px;padding:13px 0;text-align:left}
.ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tx .t1{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .t2{font-size:11.5px;color:var(--inkSoft);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .amt{font-size:14.5px;font-weight:700;white-space:nowrap}
.del{padding:6px;color:var(--inkSoft);opacity:.55}
.empty{background:var(--card);border-radius:20px;padding:44px 22px;text-align:center;
  font-size:13.5px;color:var(--inkSoft);line-height:1.75}
.acc{background:var(--card);border-radius:16px;border-left:3px solid var(--accent);overflow:hidden;margin-bottom:8px}
.acc .top{width:100%;display:flex;align-items:center;gap:10px;padding:12px 13px;text-align:left}
.acc .nm{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc .sub{font-size:10.5px;color:var(--inkSoft);margin-top:1px}
.acc .bal{font-size:15.5px;font-weight:800;white-space:nowrap}
.acc .body{padding:0 13px 13px}
.facts{display:flex;gap:16px;flex-wrap:wrap;padding-top:11px;border-top:1px solid var(--line)}
.facts .k{font-size:10px;color:var(--inkSoft);font-weight:600;margin-bottom:2px}
.facts .v{font-size:12.5px;font-weight:700}
.mini{background:var(--bg);border-radius:8px;padding:6px 11px;font-size:11.5px;font-weight:700;color:var(--inkMid)}
.grphd{display:flex;align-items:baseline;gap:7px;padding:8px 4px 7px}
.dot{width:6px;height:6px;border-radius:999px}
.legend{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.legend .nm{flex:1;font-size:13.5px;font-weight:600}
.legend .pc{font-size:12px;color:var(--inkSoft);min-width:32px;text-align:right}
.legend .vl{font-size:13.5px;font-weight:700;min-width:70px;text-align:right}
.bar{height:6px;border-radius:999px;background:var(--bg);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:10px 0 8px;font-size:10.5px;font-weight:500;color:var(--inkSoft)}
.tabs button.on{color:var(--accent);font-weight:700}
.tabs .fab{flex:0 0 auto;width:46px;height:46px;border-radius:999px;background:var(--accent);
  color:#fff;display:flex;align-items:center;justify-content:center;margin:2px 6px 0;padding:0;
  box-shadow:0 4px 12px -3px var(--accent)}
.mask{position:fixed;inset:0;background:var(--overlay);z-index:50;display:flex;align-items:flex-end}
.sheet{background:var(--card);width:100%;max-height:92vh;overflow-y:auto;border-radius:24px 24px 0 0;
  padding:10px 18px calc(18px + env(safe-area-inset-bottom));animation:up .26s cubic-bezier(.22,1,.36,1)}
@keyframes up{from{transform:translateY(22px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:38px;height:4px;border-radius:999px;background:var(--line);margin:0 auto 14px}
.shd{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.shd b{font-size:17px;font-weight:800;letter-spacing:-.025em}
.xb{width:30px;height:30px;border-radius:999px;background:var(--bg);display:flex;
  align-items:center;justify-content:center;color:var(--inkMid)}
.lb{font-size:11.5px;color:var(--inkSoft);font-weight:700;margin-bottom:9px;letter-spacing:0}
.fld{width:100%;background:var(--bg);border:none;border-radius:12px;padding:13px 14px;
  color:var(--ink);outline:none;margin-bottom:10px;font-size:15px;line-height:1.5;resize:none;display:block}
.amtin{width:100%;text-align:center;font-size:34px;font-weight:800;letter-spacing:-.03em;
  border:none;background:none;outline:none;color:var(--accent);padding:6px 0}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:3px;-webkit-overflow-scrolling:touch}
.chip{flex-shrink:0;padding:9px 14px;border-radius:999px;background:var(--bg);
  font-size:13px;font-weight:500;color:var(--inkMid);white-space:nowrap}
.chip.on{background:var(--accent);color:#fff;font-weight:700}
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.cbtn{display:flex;flex-direction:column;align-items:center;gap:5px;padding:11px 2px;
  border-radius:13px;font-size:11px;font-weight:700}
.go{width:100%;padding:15px 0;border-radius:14px;background:var(--accent);color:#fff;
  font-size:15px;font-weight:700;margin-top:6px}
.go[disabled]{background:var(--line);color:var(--inkSoft)}
.tog{width:100%;display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:12px;
  background:var(--bg);text-align:left;margin-bottom:18px}
.sw{width:36px;height:21px;border-radius:999px;background:var(--line);position:relative;flex-shrink:0}
.sw i{position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;
  transition:left .18s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tog.on .sw{background:var(--accent)}
.tog.on .sw i{left:17px}
.setrow{width:100%;background:var(--card);border-radius:16px;padding:14px 16px;display:flex;
  align-items:center;gap:12px;text-align:left;margin-bottom:8px}
.setrow .ico{flex:0 0 20px;display:flex;align-items:center;justify-content:center}
.setrow .txt{flex:1;min-width:0}
.setrow .t{display:block;font-size:14px;font-weight:600;line-height:1.35}
.setrow .d{display:block;font-size:11.5px;color:var(--inkSoft);font-weight:400;
  line-height:1.45;margin-top:3px}
.setrow .arw{flex:0 0 auto;display:flex;align-items:center;opacity:.6}
.note{font-size:11.5px;color:var(--inkSoft);line-height:1.7;padding:10px 6px 4px;word-break:keep-all}
.err{font-size:12.5px;color:var(--down);font-weight:600;line-height:1.6;margin-top:12px}
.cmp{margin-top:13px;padding-top:12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--inkMid)}
.cmp b{font-weight:800}
.chk{width:20px;height:20px;border-radius:7px;flex-shrink:0;display:flex;
  align-items:center;justify-content:center;border:1.5px solid var(--line)}
.chk.on{background:var(--accent);border-color:var(--accent)}
.brow{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;
  background:var(--card);margin-bottom:7px;text-align:left;width:100%}
.swatch{width:30px;height:30px;border-radius:9px}
.swgrid{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;margin-bottom:12px}
.igrid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-bottom:12px}
.igrid button{aspect-ratio:1;border-radius:10px;background:var(--bg);display:flex;
  align-items:center;justify-content:center;color:var(--inkMid)}
.igrid button.on{background:var(--accent);color:#fff}
svg{display:block}
</style>
</head>

// #태그 를 뽑아냅니다 (한글·영문·숫자·밑줄)
function tagsOf(x){
  var out=[], seen={};
  var src=((x.memo||"")+" "+(x.note||""));
  var re=/#([0-9A-Za-z가-힣_]+)/g, m;
  while((m=re.exec(src))){ var t=m[1]; if(!seen[t]){ seen[t]=1; out.push(t); } }
  return out;
}
function allTags(){
  var count={};
  S.tx.forEach(function(x){ tagsOf(x).forEach(function(t){ count[t]=(count[t]||0)+1; }); });
  return Object.keys(count).sort(function(a,b){ return count[b]-count[a]; })
    .map(function(t){ return {tag:t,n:count[t]}; });
}
// 화면에 보여줄 땐 태그를 강조 표시
function withTags(str){
  return esc(str).replace(/#([0-9A-Za-z가-힣_]+)/g,
    '<span style="color:var(--accent);font-weight:700">#$1</span>');
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function cat(type,key){
  var L = type==="income" ? S.icats : S.ecats;

  return L[L.length-1] || DEF_EXP[7];
}
function atype(k){ for(var i=0;i<ATYPES.length;i++) if(ATYPES[i].key===k) return ATYPES[i]; return ATYPES[0]; }
function accById(id){ for(var i=0;i<S.acc.length;i++) if(S.acc[i].id===id) return S.acc[i]; return null; }
function linkedCheck(a){ return a && a.type==="check_card" && !!a.linkedAccountId; }
function isCredit(a){ return a && a.type==="credit_card"; }
function settleId(id){ var a=accById(id); return linkedCheck(a) && accById(a.linkedAccountId) ? a.linkedAccountId : id; }

function flows(){
  var m={};
  S.acc.forEach(function(a){ m[a.id]={income:0,expense:0,tin:0,tout:0,own:0,ownIn:0}; });
  S.tx.forEach(function(t){
    if(t.type==="transfer"){
      if(linkedCheck(accById(t.fromAccountId))||linkedCheck(accById(t.toAccountId))) return;
      if(m[t.fromAccountId]) m[t.fromAccountId].tout+=t.amount;
      if(m[t.toAccountId]) m[t.toAccountId].tin+=t.amount;
      return;
    }
    if(!t.accountId||!m[t.accountId]) return;
    if(t.type==="income") m[t.accountId].ownIn+=t.amount; else m[t.accountId].own+=t.amount;
    var s=settleId(t.accountId);
    if(!m[s]) return;
    if(t.type==="income") m[s].income+=t.amount; else m[s].expense+=t.amount;
  });
  return m;
}
function balances(){
  var f=flows(), m={};
  S.acc.forEach(function(a){
    var x=f[a.id]||{income:0,expense:0,tin:0,tout:0,own:0,ownIn:0};
    if(linkedCheck(a)) m[a.id]=null;
    else if(isCredit(a)) m[a.id]=-(a.initial+x.own-x.ownIn-x.tin+x.tout);
    else m[a.id]=a.initial+x.income-x.expense+x.tin-x.tout;
  });
  return m;
}
function totalAssets(){
  var b=balances(), s=0;
  S.acc.forEach(function(a){ if(!linkedCheck(a)) s+=(b[a.id]||0); });
  return s;
}
function daysUntil(dateStr){
  if(!dateStr) return null;
  var a=new Date(today()+"T00:00:00"), b=new Date(dateStr+"T00:00:00");
  return Math.round((b-a)/86400000);
}
function monthsUntil(dateStr){
  if(!dateStr) return 0;
  var t=new Date(today()+"T00:00:00"), b=new Date(dateStr+"T00:00:00");
  var m=(b.getFullYear()-t.getFullYear())*12+(b.getMonth()-t.getMonth());
  if(b.getDate()<t.getDate()) m--;
  return Math.max(0,m);
}
// next occurrence of a monthly payment day, counting today as still due
function nextPayDate(day){
  if(!day) return today();
  var t=new Date(today()+"T00:00:00"), y=t.getFullYear(), m=t.getMonth()+1;
  var d=Math.min(day,dim(y,m));
  if(t.getDate()>d){ m++; if(m>12){m=1;y++;} d=Math.min(day,dim(y,m)); }
  return y+"-"+pad(m)+"-"+pad(d);
}
function monthsBetween(a,b){
  var sa=a.split("-").map(Number), sb=b.split("-").map(Number), o=[], y=sa[0], m=sa[1];
  while(y<sb[0]||(y===sb[0]&&m<=sb[1])){ o.push(y+"-"+pad(m)); m++; if(m>12){m=1;y++;} }
  return o;
}

/* ---------- recurring catch-up ---------- */
function runRecurring(){
  var cur=today().slice(0,7), changed=false, td=today();
  S.rec.forEach(function(r){
    if(!r.active) return;
    var due=monthsBetween(r.startMonth,cur).filter(function(ym){ return r.generatedMonths.indexOf(ym)<0; })
      .map(function(ym){ var p=ym.split("-").map(Number);
        return {ym:ym,date:ym+"-"+pad(Math.min(r.day,dim(p[0],p[1])))}; })
      .filter(function(d){ return d.date<=td; });
    if(!due.length) return;
    due.forEach(function(d){
      var n={id:uid(),amount:r.amount,memo:r.memo,date:d.date,recurringId:r.id,type:r.type};
      if(r.type==="transfer"){ n.fromAccountId=r.fromAccountId; n.toAccountId=r.toAccountId; }
      else { n.category=r.category; n.accountId=r.accountId; }
      S.tx.push(n);
      r.generatedMonths.push(d.ym);
    });
    changed=true;
  });
  if(changed){ save("transactions",S.tx); save("recurring",S.rec); }
}

function parseSms(raw){
  var text=(raw||"").replace(/\[Web발신\]/g," ").trim();
  if(!text) return null;
  var lines=text.split(/[\n\r]+/).map(function(l){return l.trim();}).filter(Boolean);
  var RE=/([\d]{1,3}(?:,[\d]{3})+|\d{3,})\s*원/g;
  function pick(src){ var o=[],m; RE.lastIndex=0;
    while((m=RE.exec(src))) o.push(parseInt(m[1].replace(/,/g,""),10));
    return o.filter(Boolean); }
  var aLine=null;
  for(var i=0;i<lines.length;i++) if(/(출금|입금|승인|결제|이체|사용)/.test(lines[i])&&/원/.test(lines[i])){aLine=lines[i];break;}
  var amount=(aLine?pick(aLine):[])[0]||pick(text)[0]||0;
  if(!amount) return null;
  var type=(/입금|입급/.test(text)&&!/출금/.test(text))||/취소/.test(text)?"income":"expense";
  var date=today(), now=new Date();
  var full=text.match(/(20\d{2})[.\-/](\d{1,2})[.\-/](\d{1,2})/);
  if(full){ var mo=+full[2],dy=+full[3];
    if(mo>=1&&mo<=12&&dy>=1&&dy<=31) date=full[1]+"-"+pad(mo)+"-"+pad(dy);
  } else {
    var md=text.match(/(\d{1,2})\s*[./월]\s*(\d{1,2})/);
    if(md){ var mo2=+md[1],dy2=+md[2];
      if(mo2>=1&&mo2<=12&&dy2>=1&&dy2<=31){
        var y=now.getFullYear(); if(mo2>now.getMonth()+1) y--;
        date=y+"-"+pad(mo2)+"-"+pad(dy2);
      } }
  }
  var NS=/^(승인|취소|출금|입금|이체|결제|사용|잔액|누적|일시불|할부)/, NL=/(카드|은행|계좌|승인|취소|잔액|누적|고객|회원)/;
  var cands=lines.filter(function(l){ return !/^\[.*\]$/.test(l) && !/\d[\d,]*\s*원/.test(l) && /[가-힣A-Za-z]/.test(l); })
    .map(function(l){ return l.replace(/^\d{2,4}[.\-/]\d{1,2}([.\-/]\d{1,2})?\s*/,"").replace(/^\d{1,2}:\d{2}(:\d{2})?\s*/,"").trim(); })
    .filter(function(l){ return l && !/^\d{1,2}:\d{2}/.test(l) && !NS.test(l) && !NL.test(l) && !/님$/.test(l); });
  var merchant=cands.length?cands[cands.length-1]:"";
  if(!merchant){
    var a1=text.match(/\d[\d,]*\s*원\s*(.+)$/m); if(a1) merchant=a1[1].trim();
    if(!merchant){ var a2=text.match(/\d{1,2}:\d{2}(?::\d{2})?\s+(.+)$/m); if(a2) merchant=a2[1].trim(); }
  }
  merchant=merchant.replace(/누적.*$/,"").replace(/잔액.*$/,"")
    .replace(/일시불|할부|승인|취소|출금|입금/g,"").replace(/^[^\wㄱ-힣]+|[^\wㄱ-힣]+$/g,"").trim();
  if(merchant.length>24) merchant=merchant.slice(0,24);
  var accountId="";
  for(var q=0;q<S.acc.length;q++) if(S.acc[q].name&&text.indexOf(S.acc[q].name)>=0){accountId=S.acc[q].id;break;}
  if(!accountId){
    var br=text.match(/(국민|신한|삼성|현대|롯데|하나|우리|농협|카카오|토스|BC|IBK|씨티|케이뱅크|새마을|우체국)/);
    if(br) for(var r2=0;r2<S.acc.length;r2++) if(S.acc[r2].name.indexOf(br[1])>=0){accountId=S.acc[r2].id;break;}
  }
  return {type:type,amount:amount,date:date,memo:merchant,accountId:accountId,
          category:type==="expense"?guessCat(merchant+" "+text):"etc_income"};
}
function splitSms(raw){
  var b=raw.split(/\n\s*\n+/).map(function(c){return c.trim();}).filter(Boolean);
  if(b.length>1) return b;
  return raw.replace(/\n(?=\[)/g,"\u0000").split("\u0000").map(function(c){return c.trim();}).filter(Boolean);
}

/* ---------- charts (hand drawn svg) ---------- */
function donut(items,total,centerTop,centerVal){
  if(!total) return "";
  var r=54,ir=38,cx=70,cy=70,ang=-Math.PI/2,out="";
  items.forEach(function(it){
    var frac=it.value/total, a2=ang+frac*Math.PI*2;
    var gap=frac>0.02?0.03:0;
    var s=ang+gap/2,e=a2-gap/2;
    if(e<s) e=s;
    var large=(e-s)>Math.PI?1:0;
    var x1=cx+r*Math.cos(s),y1=cy+r*Math.sin(s),x2=cx+r*Math.cos(e),y2=cy+r*Math.sin(e);
    var x3=cx+ir*Math.cos(e),y3=cy+ir*Math.sin(e),x4=cx+ir*Math.cos(s),y4=cy+ir*Math.sin(s);
    out+='<path d="M'+x1.toFixed(2)+' '+y1.toFixed(2)+' A'+r+' '+r+' 0 '+large+' 1 '+x2.toFixed(2)+' '+y2.toFixed(2)+
      ' L'+x3.toFixed(2)+' '+y3.toFixed(2)+' A'+ir+' '+ir+' 0 '+large+' 0 '+x4.toFixed(2)+' '+y4.toFixed(2)+
      ' Z" fill="'+it.color+'"/>';
    ang=a2;
  });
  return '<div style="position:relative;width:140px;margin:0 auto 16px">'+
    '<svg width="140" height="140" viewBox="0 0 140 140">'+out+'</svg>'+
    '<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">'+
    '<div style="font-size:10.5px;color:var(--inkSoft)">'+esc(centerTop)+'</div>'+
    '<div class="num" style="font-size:17px;font-weight:800;color:var(--down)">'+centerVal+'</div>'+
    '</div></div>';
}
function barChart(data){
  var W=300,H=150,pad=26,bw=data.length?(W-pad)/data.length:0;
  var max=1; data.forEach(function(d){ max=Math.max(max,d.income,d.expense); });
  var bars="",labels="";
  data.forEach(function(d,i){
    var x=pad+i*bw, w=Math.min(9,bw/3);
    var hi=(d.income/max)*(H-30), he=(d.expense/max)*(H-30);
    bars+='<rect x="'+(x+bw/2-w-2).toFixed(1)+'" y="'+(H-20-hi).toFixed(1)+'" width="'+w+'" height="'+Math.max(0,hi).toFixed(1)+'" rx="2.5" fill="var(--up)"/>';
    bars+='<rect x="'+(x+bw/2+2).toFixed(1)+'" y="'+(H-20-he).toFixed(1)+'" width="'+w+'" height="'+Math.max(0,he).toFixed(1)+'" rx="2.5" fill="var(--accent)" opacity=".55"/>';
    labels+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-6)+'" font-size="9" fill="var(--inkSoft)" text-anchor="middle">'+esc(d.label)+'</text>';
  });
  var grid="";
  for(var g=0;g<=2;g++){ var y=H-20-(g/2)*(H-30);
    grid+='<line x1="'+pad+'" y1="'+y.toFixed(1)+'" x2="'+W+'" y2="'+y.toFixed(1)+'" stroke="var(--line)" stroke-width="1"/>';
    grid+='<text x="2" y="'+(y+3).toFixed(1)+'" font-size="8.5" fill="var(--inkSoft)">'+
      (max*g/2>=10000?Math.round(max*g/2/10000)+"만":Math.round(max*g/2))+'</text>'; }
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'">'+grid+bars+labels+'</svg>';
}
function areaChart(pts){
  var W=300,H=140,pad=30;
  var vals=pts.map(function(p){return p.value;});
  var mx=Math.max.apply(null,vals), mn=Math.min.apply(null,vals);
  if(mx===mn){ mx=mx+1; mn=mn-1; }
  var sx=(W-pad-6)/Math.max(1,pts.length-1);
  function Y(v){ return 14+(1-(v-mn)/(mx-mn))*(H-40); }
  var d="",area="";
  pts.forEach(function(p,i){
    var x=pad+i*sx, y=Y(p.value);
    d+=(i?" L":"M")+x.toFixed(1)+" "+y.toFixed(1);
  });
  area=d+" L"+(pad+(pts.length-1)*sx).toFixed(1)+" "+(H-20)+" L"+pad+" "+(H-20)+" Z";
  var labels="";
  pts.forEach(function(p,i){ if(i%2) return;
    labels+='<text x="'+(pad+i*sx).toFixed(1)+'" y="'+(H-5)+'" font-size="8.5" fill="var(--inkSoft)" text-anchor="middle">'+esc(p.label)+'</text>'; });
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'">'+
    '<defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0%" stop-color="var(--accent)" stop-opacity=".3"/>'+
    '<stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>'+
    '<path d="'+area+'" fill="url(#g1)"/>'+
    '<path d="'+d+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>'+
    labels+'</svg>';
}

        '<span style="font-size:11px;color:var(--inkSoft)">'+L.length+'</span><span style="flex:1"></span>'+
        (has?'<span class="num" style="font-size:12.5px;font-weight:700;color:var(--inkMid)">'+won(sub)+'</span>':'')+'</div>';
      L.forEach(function(a){ h+=accCard(a,b,f,S.acc.indexOf(a)); });
    });
  } else S.acc.forEach(function(a,i){ h+=accCard(a,b,f,i); });

function accCard(a,b,f,idx){
  var t=atype(a.type), x=f[a.id]||{income:0,expense:0,tin:0,tout:0,own:0,ownIn:0};
  var lk=linkedCheck(a)?accById(a.linkedAccountId):null, cr=isCredit(a);
  var shown=lk?(b[lk.id]||0):cr?-(b[a.id]||0):(b[a.id]||0);
  var col=lk?"var(--inkMid)":cr?((-(b[a.id]||0))>0?"var(--down)":"var(--ink)"):((b[a.id]||0)<0?"var(--down)":"var(--ink)");
  var open=S.openAcc===a.id;
  var h='<div class="acc" style="border-left-color:'+t.color+'">'+
    '<button class="top" data-accopen="'+a.id+'">'+
    '<div class="ic" style="width:32px;height:32px;background:'+t.color+'1f">'+svg(t.icon,15,t.color)+'</div>'+
    '<div style="flex:1;min-width:0"><div class="nm">'+esc(a.name)+'</div>'+
    '<div class="sub">'+(lk?esc(lk.name)+"에서 결제":cr?"미결제":t.label)+'</div></div>'+
    '<div class="bal num" style="color:'+col+'">'+won(shown)+'</div>'+
    '<span style="flex-shrink:0;color:var(--inkSoft);transform:rotate('+(open?180:0)+'deg)">'+svg("down",14)+'</span></button>';
  if(open){
    var facts=lk?[{k:"이 카드 사용액",v:x.own,c:"var(--down)"}]
      :cr?[{k:"이월",v:a.initial,c:"var(--inkMid)"},{k:"사용",v:x.own,c:"var(--down)"},{k:"결제",v:x.tin,c:"var(--up)"}]
      :[{k:"시작",v:a.initial,c:"var(--inkMid)"},{k:"수입",v:x.income,c:"var(--up)"},{k:"지출",v:x.expense,c:"var(--down)"}];
    if(!lk&&!cr&&(x.tin+x.tout)) facts.push({k:"이체",v:x.tin-x.tout,c:(x.tin-x.tout)>=0?"var(--up)":"var(--down)",s:1});
    h+='<div class="body"><div class="facts">';
    facts.forEach(function(ft){ h+='<div><div class="k">'+ft.k+'</div><div class="v num" style="color:'+ft.c+'">'+
      (ft.s?(ft.v>=0?"+":"−"):"")+won(Math.abs(ft.v))+'</div></div>'; });
    h+='</div>';

    if(a.type==="installment" && a.maturity){
      var dleft=daysUntil(a.maturity), mleft=monthsUntil(a.maturity);
      var proj=(b[a.id]||0)+(a.monthly||0)*mleft;
      var done=dleft!==null&&dleft<=0;
      h+='<div style="margin-top:12px;padding:12px 13px;background:var(--bg);border-radius:12px">'+
        '<div style="display:flex;align-items:baseline;gap:8px;margin-bottom:'+(done?0:8)+'px">'+
        '<span style="font-size:11.5px;font-weight:700;color:'+(done?"var(--up)":"var(--inkMid)")+'">'+
        (done?"만기 도래":"만기 D-"+dleft)+'</span>'+
        '<span style="font-size:11px;color:var(--inkSoft)">'+esc(a.maturity)+'</span></div>';
      if(!done){
        h+='<div style="display:flex;gap:16px;flex-wrap:wrap">'+
          '<div><div style="font-size:10px;color:var(--inkSoft);font-weight:600;margin-bottom:2px">남은 기간</div>'+
          '<div class="num" style="font-size:12.5px;font-weight:700">'+mleft+'개월</div></div>';
        if(a.monthly>0){
          h+='<div><div style="font-size:10px;color:var(--inkSoft);font-weight:600;margin-bottom:2px">월 납입</div>'+
            '<div class="num" style="font-size:12.5px;font-weight:700">'+won(a.monthly)+'</div></div>'+
            '<div><div style="font-size:10px;color:var(--inkSoft);font-weight:600;margin-bottom:2px">만기 예상</div>'+
            '<div class="num" style="font-size:12.5px;font-weight:700;color:var(--accent)">'+won(proj)+'</div></div>';
        }
        h+='</div>';
      }
      h+='</div>';
    }

    if(cr){
      var owed=-(b[a.id]||0);
      var due=a.payDay?nextPayDate(a.payDay):"";
      var dd=due?daysUntil(due):null;
      h+='<div style="margin-top:12px;padding:12px 13px;background:var(--bg);border-radius:12px;'+
        'display:flex;align-items:center;gap:10px">'+
        '<div style="flex:1;min-width:0">'+
        '<div style="font-size:11.5px;font-weight:700;color:var(--inkMid)">'+
        (a.payDay?("결제일 D-"+dd+" · 매달 "+a.payDay+"일"):"결제일 미설정")+'</div>'+
        '<div class="num" style="font-size:11px;color:var(--inkSoft);margin-top:2px">'+
        (owed>0?"결제할 금액 "+won(owed)+"원":"결제할 금액 없음")+'</div></div>'+
        (owed>0?'<button class="mini" data-paycard="'+a.id+'" style="background:var(--accent);color:#fff;padding:9px 14px">결제하기</button>':'')+
        '</div>';
    }

    h+='<div style="display:flex;align-items:center;gap:6px;margin-top:12px">'+
      '<button class="mini" data-accedit="'+a.id+'">수정</button>'+
      '<button class="mini" data-accdel="'+a.id+'" style="color:var(--down)">삭제</button><span style="flex:1"></span>';
    if(!S.grouped) h+='<button class="mini" data-accmv="'+a.id+'|-1" style="padding:6px 9px'+(idx===0?';opacity:.3':'')+'">'+svg("up",14)+'</button>'+
      '<button class="mini" data-accmv="'+a.id+'|1" style="padding:6px 9px'+(idx===S.acc.length-1?';opacity:.3':'')+'">'+svg("down",14)+'</button>';
    h+='</div></div>';
  }
  return h+'</div>';
}

      h+='</div>'; }

  save("expenseCats",S.ecats); save("incomeCats",S.icats); }

/* ---------- events ---------- */
document.addEventListener("click",function(ev){
  var el=ev.target.closest?ev.target.closest("[data-tab],[data-nav],[data-per],[data-theme],[data-smart],[data-new],[data-edit],[data-del],[data-mask],[data-close],[data-mtype],[data-macc],[data-mcat],[data-mfrom],[data-mto],[data-mrep],[data-editcats],[data-grp],[data-acc],[data-accopen],[data-accedit],[data-accdel],[data-accmv],[data-atype],[data-alink],[data-asave],[data-rtog],[data-rdel],[data-cats],[data-exp],[data-imp],[data-smsgo],[data-bt],[data-bback],[data-bsave],[data-cmv],[data-cedit],[data-cdel],[data-cnew],[data-cicon],[data-ccol],[data-ccommit],[data-csave],[data-quick],[data-search],[data-fty],[data-fcat],[data-budget],[data-bsaveall],[data-paycard],[data-settings],[data-tag],#save"):null;
  if(!el) return;
  var d=el.dataset||{};

  if(el.id==="save"){ commitTx(); return; }
  if(d.mask!==undefined && ev.target===el){ M=(M&&M.back)||null; render(); return; }
  if(d.close!==undefined){ M=(M&&M.back)||null; render(); return; }
  if(d.tab){ S.tab=d.tab; S.openAcc=null; render(); return; }
  if(d.nav){ var k=d.nav[0], dir=parseInt(d.nav.slice(1),10);
    if(k==="m") S.mOff+=dir; else S.yOff+=dir; render(); return; }
  if(d.per){ S.period=d.per; render(); return; }
  if(d.settings!==undefined){ M={settings:true}; render(); return; }
  if(d.theme!==undefined){
    S.theme = S.theme==="dark" ? "light" : "dark";
    save("theme",S.theme); render(); return; }
  if(d.grp!==undefined){ S.grouped=!S.grouped; render(); return; }

  if(d.smart!==undefined){ M={sms:"",err:"",batch:null}; render(); return; }
  if(d.new!==undefined){ M=newTxState(); render(); return; }
  if(d.edit){ var t=S.tx.filter(function(x){return x.id===d.edit;})[0];
    if(t){ M=newTxState(t); M.editId=t.id; } render(); return; }
  if(d.del){
    var gone=null;
    S.tx=S.tx.filter(function(x){ if(x.id===d.del){ gone=x; return false; } return true; });
    if(gone){
      LAST_DEL=gone;
      save("transactions",S.tx);
      if(UNDO_TIMER) clearTimeout(UNDO_TIMER);
      UNDO_TIMER=setTimeout(function(){ LAST_DEL=null; render(); }, 6000);
      render();
    }
    return; }

  // tx modal
  if(d.mtype){ M.type=d.mtype;
    var L=d.mtype==="income"?S.icats:S.ecats; M.cat=L[0]?L[0].key:""; render(); return; }
  if(d.macc){ M.acc=d.macc; render(); return; }
  if(d.mcat){ M.cat=d.mcat; render(); return; }
  if(d.mfrom!==undefined){ M.from=d.mfrom; render(); return; }
  if(d.mto!==undefined){ M.to=d.mto; render(); return; }
  if(d.mrep!==undefined){ syncTx(); M.rep=!M.rep; render(); return; }
  if(d.editcats){ syncTx();
    M={kind:d.editcats,list:(d.editcats==="income"?S.icats:S.ecats).slice(),edit:null,back:M};
    render(); return; }

  // smart
  if(d.smsgo!==undefined){
    var raw=(document.getElementById("sms")||{}).value||"";
    var chunks=splitSms(raw);
    if(chunks.length>1){
      var many=chunks.map(parseSms).filter(Boolean).map(function(p){ p._use=true; return p; });
      if(!many.length){ M.err="금액을 찾지 못했어요. 문자 전체를 붙여넣어 주세요."; M.sms=raw; render(); return; }
      M.batch=many; render(); return;
    }
    var one=parseSms(raw);
    if(!one){ M.err="금액을 찾지 못했어요. 문자 전체를 붙여넣어 주세요."; M.sms=raw; render(); return; }
    M=newTxState(one); M.pre=true; render(); return;
  }
  if(d.bt){ var i2=+d.bt; M.batch[i2]._use=!M.batch[i2]._use; render(); return; }
  if(d.bback!==undefined){ M.batch=null; M.err=""; render(); return; }
  if(d.bsave!==undefined){
    M.batch.filter(function(b){return b._use;}).forEach(function(b){
      S.tx.push({id:uid(),type:b.type,category:b.category,amount:b.amount,memo:b.memo,date:b.date,accountId:b.accountId}); });
    save("transactions",S.tx); M=null; render(); return;
  }

  // assets
  if(d.accopen){ S.openAcc=S.openAcc===d.accopen?null:d.accopen; render(); return; }
  if(d.acc==="new"){ M={atype:"cash",name:"",init:"",link:"",mat:"",mon:"",day:"",editId:null}; render(); return; }
  if(d.accedit){ var a=accById(d.accedit);
    if(a) M={atype:a.type,name:a.name,init:String(a.initial),link:a.linkedAccountId||"",
      mat:a.maturity||"",mon:a.monthly?String(a.monthly):"",day:a.payDay?String(a.payDay):"",editId:a.id};
    render(); return; }
  if(d.accdel){ if(confirm("이 자산을 지울까요? 관련 이체 기록도 함께 지워져요.")){
      S.acc=S.acc.filter(function(x){return x.id!==d.accdel;}).map(function(x){
        return x.linkedAccountId===d.accdel?Object.assign({},x,{linkedAccountId:""}):x; });
      S.tx=S.tx.filter(function(x){ return !(x.type==="transfer"&&(x.fromAccountId===d.accdel||x.toAccountId===d.accdel)); })
        .map(function(x){ return x.accountId===d.accdel?Object.assign({},x,{accountId:""}):x; });
      S.rec=S.rec.filter(function(r){ return !(r.type==="transfer"&&(r.fromAccountId===d.accdel||r.toAccountId===d.accdel)); });
      saveAll(); render(); } return; }
  if(d.paycard){
    var card=accById(d.paycard);
    if(card){
      var bb=balances(), owe=-(bb[card.id]||0);
      var src=S.acc.filter(function(x){ return ["cash","savings","installment"].indexOf(x.type)>=0; })[0];
      var st=newTxState();
      st.type="transfer";
      st.amount=owe>0?String(owe):"";
      st.from=src?src.id:"";
      st.to=card.id;
      st.date=card.payDay?nextPayDate(card.payDay):today();
      st.memo=card.name+" 결제";
      M=st; render();
    }
    return; }
  if(d.accmv){ var pp=d.accmv.split("|"), ix=-1;
    S.acc.forEach(function(x,n){ if(x.id===pp[0]) ix=n; });
    var jx=ix+parseInt(pp[1],10);
    if(ix>=0&&jx>=0&&jx<S.acc.length){ var tmp2=S.acc[ix]; S.acc[ix]=S.acc[jx]; S.acc[jx]=tmp2;
      save("accounts",S.acc); render(); } return; }
  if(d.atype){ syncAcc(); M.atype=d.atype; render(); return; }
  if(d.alink!==undefined){ syncAcc(); M.link=d.alink; render(); return; }
  if(d.asave!==undefined){ commitAcc(); return; }
  if(d.rtog){ S.rec.forEach(function(r){ if(r.id===d.rtog) r.active=!r.active; });
    save("recurring",S.rec); render(); return; }
  if(d.rdel){ if(confirm("이 반복 거래를 지울까요? 이미 기록된 내역은 남아요.")){
    S.rec=S.rec.filter(function(r){return r.id!==d.rdel;}); save("recurring",S.rec); render(); } return; }

  if(d.quick!==undefined){
    var r=(M._recent||[])[+d.quick];
    if(r){ syncTx(); M.amount=String(r.amount); M.memo=r.memo; M.cat=r.category;
      if(r.accountId) M.acc=r.accountId; render(); }
    return; }
  if(d.search!==undefined){ M={ftype:"all",fcat:"",q:""}; render(); return; }
  if(d.tag){ M={tag:d.tag,back:M}; render(); return; }
  if(d.fty){ syncSearch(); M.ftype=d.fty; M.fcat=""; render(); return; }
  if(d.fcat!==undefined){ syncSearch(); M.fcat=d.fcat; render(); return; }
  if(d.budget!==undefined){ M={vals:Object.assign({},S.budgets),back:M&&M.settings?{settings:true}:null}; render(); return; }
  if(d.bsaveall!==undefined){
    syncBudget();
    var out={};
    Object.keys(M.vals).forEach(function(k){ var v=parseInt(M.vals[k],10); if(v>0) out[k]=v; });
    S.budgets=out; save("budgets",S.budgets); M=(M&&M.back)||null; render(); return; }

  // settings
  if(d.cats){ M={kind:d.cats,list:(d.cats==="income"?S.icats:S.ecats).slice(),edit:null,
    back:M&&M.settings?{settings:true}:null}; render(); return; }
  if(d.exp!==undefined){ doExport(); return; }
  if(d.imp!==undefined){ var f=document.getElementById("impf"); if(f) f.click(); return; }

  // category manager
  if(d.cnew!==undefined){ M.edit={key:null,label:"",icon:"dots",color:SW[0]}; render(); return; }
  if(d.cedit){ M.edit=Object.assign({},M.list[+d.cedit]); render(); return; }
  if(d.cdel){ M.list.splice(+d.cdel,1); render(); return; }
  if(d.cmv){ var q=d.cmv.split("|"), a1=+q[0], b1=a1+parseInt(q[1],10), lastI=M.list.length-1;
    if(a1<lastI&&b1>=0&&b1<=lastI-1){ var s1=M.list[a1]; M.list[a1]=M.list[b1]; M.list[b1]=s1; render(); } return; }
  if(d.cicon){ syncCat(); M.edit.icon=d.cicon; render(); return; }
  if(d.ccol){ syncCat(); M.edit.color=decodeURIComponent(d.ccol); render(); return; }
  if(d.ccommit!==undefined){ syncCat();
    if(!M.edit.label.trim()) return;
    if(M.edit.key){ M.list=M.list.map(function(c){ return c.key===M.edit.key?
      {key:c.key,label:M.edit.label.trim(),icon:M.edit.icon,color:M.edit.color}:c; }); }
    else { M.list.splice(M.list.length-1,0,{key:uid(),label:M.edit.label.trim(),icon:M.edit.icon,color:M.edit.color}); }
    M.edit=null; render(); return; }
  if(d.csave!==undefined){
    var keys=M.list.map(function(c){return c.key;}), fb=keys[keys.length-1], kind=M.kind;
    if(kind==="income") S.icats=M.list; else S.ecats=M.list;
    S.tx=S.tx.map(function(x){ return (x.type===kind&&keys.indexOf(x.category)<0)?Object.assign({},x,{category:fb}):x; });
    S.rec=S.rec.map(function(r){ return (r.type===kind&&keys.indexOf(r.category)<0)?Object.assign({},r,{category:fb}):r; });
    saveAll();
    var back=M.back||null;
    if(back && back.type===kind && keys.indexOf(back.cat)<0) back.cat=fb;
    M=back; render(); return; }
});

/* keep typed values when the sheet re-renders */
function syncTx(){
  var a=document.getElementById("amt"), m=document.getElementById("memo"),
      dd=document.getElementById("dt"), nt=document.getElementById("note");
  if(a) M.amount=a.value.replace(/[^0-9]/g,"");
  if(m) M.memo=m.value;
  if(nt) M.note=nt.value;
  if(dd) M.date=dd.value||M.date;
}
function syncAcc(){
  var n=document.getElementById("anm"), i=document.getElementById("ainit"),
      mt=document.getElementById("amat"), mo=document.getElementById("amon"),
      dy=document.getElementById("aday");
  if(n) M.name=n.value;
  if(i) M.init=i.value.replace(/[^0-9]/g,"");
  if(mt) M.mat=mt.value;
  if(mo) M.mon=mo.value.replace(/[^0-9]/g,"");
  if(dy){ var v=parseInt(dy.value.replace(/[^0-9]/g,""),10);
    M.day = (v>=1&&v<=31) ? String(v) : ""; }
}
function syncSearch(){
  var q=document.getElementById("q"); if(q) M.q=q.value;
}
function syncBudget(){
  var els=document.querySelectorAll?document.querySelectorAll("[data-bk]"):[];
  for(var i=0;i<els.length;i++) M.vals[els[i].getAttribute("data-bk")]=els[i].value.replace(/[^0-9]/g,"");
}
function syncCat(){ var n=document.getElementById("cnm"); if(n&&M.edit) M.edit.label=n.value; }

document.addEventListener("input",function(e){
  if(e.target.id==="amt"){
    var v=e.target.value.replace(/[^0-9]/g,"");
    M.amount=v;
    e.target.value=v?Number(v).toLocaleString("ko-KR"):"";
    var btn=document.getElementById("save");
    if(btn){ var bad=M.type==="transfer"&&(!M.from||!M.to||M.from===M.to);
      btn.disabled=!v||bad; }
  }
  if(e.target.id==="q"){ M.q=e.target.value; render();
    var f=document.getElementById("q"); if(f){ f.focus(); try{ f.setSelectionRange(f.value.length,f.value.length); }catch(err){} }
    return; }
  if(e.target.getAttribute && e.target.getAttribute("data-bk")){
    var k=e.target.getAttribute("data-bk"), v=e.target.value.replace(/[^0-9]/g,"");
    M.vals[k]=v; e.target.value=v?Number(v).toLocaleString("ko-KR"):"";
    return; }
  if(e.target.id==="ainit"){
    var v2=e.target.value.replace(/[^0-9]/g,"");
    M.init=v2; e.target.value=v2?Number(v2).toLocaleString("ko-KR"):"";
  }
});
document.addEventListener("change",function(e){
  if(e.target.id==="impf"&&e.target.files&&e.target.files[0]) doImport(e.target.files[0]);
});

function newTxState(seed){
  var s=seed||null;
  return {
    type:s?s.type:"expense",
    cat:s?s.category:(S.ecats[0]?S.ecats[0].key:""),
    amount:s?String(s.amount):"",
    memo:s?(s.memo||""):"",
    note:s?(s.note||""):"",
    date:s?s.date:today(),
    acc:s&&s.accountId?s.accountId:(S.acc[0]?S.acc[0].id:""),
    from:s&&s.fromAccountId?s.fromAccountId:(S.acc[0]?S.acc[0].id:""),
    to:s&&s.toAccountId?s.toAccountId:"",
    rep:false, editId:null, pre:false
  };
}
function commitTx(){
  syncTx();
  var n=parseInt(M.amount,10);
  if(!n||n<=0) return;
  var isT=M.type==="transfer";
  if(isT&&(!M.from||!M.to||M.from===M.to)) return;
  var rec=M.editId?S.tx.filter(function(x){return x.id===M.editId;})[0]:null;
  var o={id:M.editId||uid(),type:M.type,amount:n,memo:M.memo.trim(),note:(M.note||"").trim(),date:M.date};
  if(rec&&rec.recurringId) o.recurringId=rec.recurringId;
  if(isT){ o.fromAccountId=M.from; o.toAccountId=M.to; }
  else { o.category=M.cat; o.accountId=M.acc; }
  if(M.editId) S.tx=S.tx.map(function(x){ return x.id===M.editId?o:x; });
  else{
    S.tx.push(o);
    if(M.rep){
      var r={id:uid(),type:M.type,amount:n,memo:M.memo.trim(),day:+M.date.slice(8,10),
        startMonth:M.date.slice(0,7),active:true,generatedMonths:[M.date.slice(0,7)]};
      if(isT){ r.fromAccountId=M.from; r.toAccountId=M.to; } else { r.category=M.cat; r.accountId=M.acc; }
      S.rec.push(r); save("recurring",S.rec);
    }
  }
  save("transactions",S.tx); M=null; render();
}
function commitAcc(){
  syncAcc();
  if(!M.name.trim()) return;
  var link=M.atype==="check_card"?M.link:"";
  var payload={name:M.name.trim(),type:M.atype,initial:link?0:(parseInt(M.init,10)||0),linkedAccountId:link,
    maturity:M.atype==="installment"?(M.mat||""):"",
    monthly:M.atype==="installment"?(parseInt(M.mon,10)||0):0,
    payDay:M.atype==="credit_card"?(parseInt(M.day,10)||0):0};
  if(M.editId) S.acc=S.acc.map(function(a){ return a.id===M.editId?Object.assign({},a,payload):a; });
  else S.acc.push(Object.assign({id:uid()},payload));
  save("accounts",S.acc); M=null; render();
}

/* ---------- backup ---------- */
function doExport(){
  var payload={app:"worth",version:1,exportedAt:new Date().toISOString(),
    transactions:S.tx,accounts:S.acc,recurring:S.rec,expenseCats:S.ecats,incomeCats:S.icats};
  var txt=JSON.stringify(payload,null,2);
  try{
    var blob=new Blob([txt],{type:"application/json"});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");
    a.href=url; a.download="worth-backup-"+today()+".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); },1000);
  }catch(e){
    // some in-app browsers block downloads: show the text so it can be copied
    var w=window.open("","_blank");
    if(w){ w.document.write("<pre>"+esc(txt)+"</pre>"); }
    else alert("이 브라우저에서는 파일 저장이 막혀 있어요. 사파리나 크롬에서 열어주세요.");
  }
}
function doImport(file){
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var d=JSON.parse(fr.result);
      if(!d||!(d.transactions instanceof Array)||!(d.accounts instanceof Array)){
        alert("이 파일은 ₩orth 백업 파일이 아닌 것 같아요."); return; }
      if(!confirm("거래 "+d.transactions.length+"건을 불러올까요?\n지금 기록은 지워지고 백업 내용으로 바뀝니다.")) return;
      S.tx=d.transactions; S.acc=d.accounts; S.rec=d.recurring||[];
      if(d.expenseCats&&d.expenseCats.length) S.ecats=d.expenseCats;
      if(d.incomeCats&&d.incomeCats.length) S.icats=d.incomeCats;
      saveAll(); M=null; render(); alert("불러오기가 끝났어요.");
    }catch(e){ alert("파일을 읽지 못했어요."); }
  };
  fr.readAsText(file);
}

/* ---------- undo ---------- */
var LAST_DEL=null, UNDO_TIMER=null;
document.addEventListener("click",function(e){
  var b=e.target.closest && e.target.closest("#undo");
  if(!b || !LAST_DEL) return;
  S.tx.push(LAST_DEL);
  LAST_DEL=null;
  if(UNDO_TIMER) clearTimeout(UNDO_TIMER);
  save("transactions",S.tx);
  render();
});

/* ---------- update check ---------- */
var UPDATE_READY = false;
function checkUpdate(){
  // Re-fetch this same page bypassing the cache and compare the version stamp.
  try{
    fetch(location.href.split("#")[0], {cache:"no-store"})
      .then(function(r){ return r.ok ? r.text() : null; })
      .then(function(t){
        if(!t) return;
        var m = t.match(/APP_VERSION\s*=\s*"([^"]+)"/);
        if(m && m[1] !== APP_VERSION && !UPDATE_READY){ UPDATE_READY = true; render(); }
      })
      .catch(function(){});
  }catch(e){}
}
document.addEventListener("click",function(e){
  var b = e.target.closest && e.target.closest("#upd");
  if(!b) return;
  location.reload(true);
});
document.addEventListener("visibilitychange",function(){
  if(!document.hidden) checkUpdate();
});

/* ---------- go ---------- */
try{ runRecurring(); render(); setTimeout(checkUpdate, 1500); }
catch(e){
  document.getElementById("app").innerHTML=
    '<div style="padding:28px;font-size:13px;color:#6B6D6C"><b style="display:block;font-size:15px;color:#2B2B2C;margin-bottom:8px">오류가 났어요</b>'+
    '<pre style="white-space:pre-wrap;font-size:11px;color:#BF7266">'+esc(e&&e.message||e)+'</pre></div>';
}
</script>
