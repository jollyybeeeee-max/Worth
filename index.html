<style>
:root{
  color-scheme: light;
  --bg:#F5F5F3; --card:#FFF; --line:#EBEAE7; --ink:#2B2B2C; --inkMid:#6B6D6C;
  --inkSoft:#A0A19F; --accent:#5D9884; --accentSoft:#E7EFEC; --pastel:#DCE9E3;
  --up:#5D9884; --down:#BF7266; --overlay:rgba(43,43,44,.42);
}
html[data-theme="dark"]{
  color-scheme: dark;
  --bg:#15171A; --card:#1E2125; --line:#2C3035; --ink:#E8E9EA; --inkMid:#A2A6AB;
  --inkSoft:#71767C; --accent:#6FB09A; --accentSoft:#25352F; --pastel:#22302B;
  --up:#6FB09A; --down:#D08578; --overlay:rgba(0,0,0,.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);min-height:100%;scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} }
html,body{margin:0;padding:0;background:var(--bg);forced-color-adjust:none;
  min-height:100vh;overscroll-behavior-y:none;max-width:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color:var(--ink);-webkit-text-size-adjust:100%;
  word-break:keep-all;overflow-wrap:break-word;letter-spacing:-.01em}
body{padding-bottom:env(safe-area-inset-bottom);-webkit-overflow-scrolling:touch}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px;min-width:0;max-width:100%}
input[type="date"]{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;
  width:100%;box-sizing:border-box}
.fld.dt{flex:1 1 0;min-width:0;width:auto;margin:0;padding:11px 8px;font-size:13px;text-align:center}
.fld.dt::-webkit-date-and-time-value{text-align:center;margin:0}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.blur{filter:blur(7px);opacity:.55;user-select:none;pointer-events:none}
.blur.sm{filter:blur(5px)}
body::before{content:"";position:fixed;inset:-2px;background:var(--bg);z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;width:100%;max-width:520px;margin:0 auto;padding:0 16px 104px}
.hdr{position:sticky;top:0;z-index:25;display:flex;align-items:center;justify-content:space-between;
  padding:16px 0 12px;background:var(--bg);
  box-shadow:-16px 0 0 var(--bg),16px 0 0 var(--bg),0 6px 12px -10px rgba(0,0,0,.35)}
/* 시트 안의 검색창도 스크롤 시 따라오도록 */
.stick{position:sticky;top:0;z-index:5;background:var(--card);padding-top:2px}
.logo{font-size:22px;font-weight:800;letter-spacing:-.04em}
.logo span{color:var(--accent)}
.hbtns{display:flex;align-items:center;gap:7px}
.ib{position:relative;width:34px;height:34px;border-radius:11px;background:var(--card);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--inkMid)}
.pb{height:34px;border-radius:11px;background:var(--accent);color:#fff;display:flex;align-items:center;
  gap:4px;padding:0 13px 0 10px;font-size:12.5px;font-weight:700}
.hero{background:var(--pastel);border-radius:22px;padding:20px}
.hero .lbl{font-size:11.5px;font-weight:700;color:var(--inkMid)}
.hero .big{font-size:32px;font-weight:800;letter-spacing:-.04em;margin-top:6px;line-height:1.1}
.hero .big small{font-size:19px;font-weight:700}
.row3{display:flex;gap:20px;margin-top:18px;padding-top:16px;border-top:1px solid rgba(93,152,132,.25)}
.row3 .k{font-size:11px;font-weight:600;color:var(--inkMid)}
.hero .k{font-size:11px;font-weight:600;color:var(--inkMid)}
.hero .v{font-size:16px;font-weight:700;margin-top:4px;letter-spacing:-.03em}
.row3 .v{font-size:15.5px;font-weight:700;margin-top:3px}
.nav{display:flex;align-items:center;gap:12px;justify-content:center;margin:14px 0}
.nav b{font-size:14px;font-weight:700;min-width:96px;text-align:center}
.nav button{width:30px;height:30px;border-radius:999px;background:var(--card);
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--accent)}
.seg{display:flex;gap:4px;background:var(--card);border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{flex:1;padding:9px 0;border-radius:9px;font-size:13.5px;font-weight:700;color:var(--inkSoft)}
.seg button.on{background:var(--accent);color:#fff}
.card{background:var(--card);border-radius:20px;padding:18px;margin-bottom:12px}
.ttl{font-size:13px;font-weight:800;margin-bottom:14px;letter-spacing:-.02em}
.daygrp{margin-top:16px}
.dayhd{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 7px;
  font-size:12.5px;font-weight:700;color:var(--inkMid)}
.list{background:var(--card);border-radius:18px;overflow:hidden}
.list .tx{padding-left:14px;padding-right:14px}
.list .swdel{border-radius:0}
.swrap{position:relative;border-bottom:1px solid var(--line);overflow:hidden}
.swrap:last-child{border-bottom:none}
.swdel{position:absolute;right:0;top:0;bottom:0;width:84px;background:var(--down);color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:11px;font-weight:700;border-radius:0}
.tx{position:relative;display:flex;align-items:center;gap:11px;min-width:0;background:var(--card);
  transition:transform .22s cubic-bezier(.22,1,.36,1);will-change:transform;touch-action:pan-y}
.tx.swopen{transform:translateX(-84px)}

function tagsOf(x){
  var out=[], seen={};
  var src=((x.memo||"")+" "+(x.note||""));
  var re=/#([0-9A-Za-z가-힣_]+)/g, m;
  while((m=re.exec(src))){ var t=m[1]; if(!seen[t]){ seen[t]=1; out.push(t); } }
  return out;
}
function allTags(){

  return Object.keys(count).sort(function(a,b){ return count[b]-count[a]; })
    .map(function(t){ return {tag:t,n:count[t]}; });
}

function accByRecent(){

  for(var i=S.tx.length-1;i>=0 && n<200;i--,n++){
    var t=S.tx[i];
    if(t.type==="transfer"){
      if(t.fromAccountId && !(t.fromAccountId in rank)) rank[t.fromAccountId]=n;
      if(t.toAccountId && !(t.toAccountId in rank)) rank[t.toAccountId]=n;
    } else if(t.accountId && !(t.accountId in rank)) rank[t.accountId]=n;
  }
  return S.acc.slice().sort(function(a,b){
    var ra=(a.id in rank)?rank[a.id]:9999, rb=(b.id in rank)?rank[b.id]:9999;
    if(ra!==rb) return ra-rb;
    return S.acc.indexOf(a)-S.acc.indexOf(b);
  });
}

function linkedCheck(a){ return a && a.type==="check_card" && !!a.linkedAccountId; }
function isCredit(a){ return a && a.type==="credit_card"; }
function settleId(id){ var a=accById(id); return linkedCheck(a) && accById(a.linkedAccountId) ? a.linkedAccountId : id; }

/* ---------- 정산 (대표로 결제하고 일부를 돌려받은 거래) ----------
   카드에는 전액이 청구되지만, 가계부 지출로는 '내 몫'만 잡습니다.
   돌려받은 돈은 받은 자산의 잔액에 더해집니다. */
function stlOf(x){
  return (x && x.type==="expense" && x.settle && x.settle.mine>=0) ? x.settle : null;
}
function eAmt(x){ var s=stlOf(x); return s ? s.mine : x.amount; }

function flows(){
  var m={};
  S.acc.forEach(function(a){ m[a.id]={income:0,expense:0,tin:0,tout:0,own:0,ownIn:0}; });
  S.tx.forEach(function(t){
    if(t.type==="transfer"){
      if(linkedCheck(accById(t.fromAccountId))||linkedCheck(accById(t.toAccountId))) return;
      if(m[t.fromAccountId]) m[t.fromAccountId].tout+=t.amount;
      if(m[t.toAccountId]) m[t.toAccountId].tin+=t.amount;
      return;
    }
    if(!t.accountId||!m[t.accountId]) return;
    if(t.type==="income") m[t.accountId].ownIn+=t.amount; else m[t.accountId].own+=t.amount;
    var s=settleId(t.accountId);
    if(!m[s]) return;
    if(t.type==="income") m[s].income+=t.amount; else m[s].expense+=t.amount;
  });
  // 정산으로 돌려받은 돈은 받은 자산으로 들어옵니다
  S.tx.forEach(function(t){
    var st=stlOf(t);
    if(!st || !st.got || !st.accountId || !m[st.accountId]) return;
    m[st.accountId].ownIn+=st.got;
    var s2=settleId(st.accountId);
    if(m[s2]) m[s2].income+=st.got;
  });
  return m;
}
function balances(){
  var f=flows(), m={};
  S.acc.forEach(function(a){
    var x=f[a.id]||{income:0,expense:0,tin:0,tout:0,own:0,ownIn:0};
    if(linkedCheck(a)) m[a.id]=null;
    else if(isCredit(a)) m[a.id]=-(a.initial+x.own-x.ownIn-x.tin+x.tout);
    else m[a.id]=a.initial+x.income-x.expense+x.tin-x.tout;
  });
  return m;
}
function totalAssets(){
  var b=balances(), s=0;
  S.acc.forEach(function(a){ if(!linkedCheck(a)) s+=(b[a.id]||0); });
  return s;
}
function daysUntil(dateStr){
  if(!dateStr) return null;
  var a=new Date(today()+"T00:00:00"), b=new Date(dateStr+"T00:00:00");
  return Math.round((b-a)/86400000);
}
function monthsUntil(dateStr){
  if(!dateStr) return 0;
  var t=new Date(today()+"T00:00:00"), b=new Date(dateStr+"T00:00:00");
  var m=(b.getFullYear()-t.getFullYear())*12+(b.getMonth()-t.getMonth());
  if(b.getDate()<t.getDate()) m--;
  return Math.max(0,m);
}
// next occurrence of a monthly payment day, counting today as still due
// 이번 결제일에 청구될 사용 기간을 구합니다.
// cycle "prev"  : 지난달 1일 ~ 말일 (가장 흔한 방식)
// cycle "mid"   : 지지난달 cycleDay ~ 지난달 (cycleDay-1)
// cycle "custom": 직접 정한 시작일 기준
function billingRange(card, payDate){
  var d = new Date((payDate||today())+"T00:00:00");
  var y = d.getFullYear(), m = d.getMonth();      // m: 0-based, 결제월
  var cyc = card.cycle || "prev";
  var from, to;
  if(cyc === "mid" || cyc === "custom"){
    var sd = Math.max(1, Math.min(28, parseInt(card.cycleDay,10) || 1));
    // 지난달 sd일 ~ 이번달 (sd-1)일
    from = new Date(y, m-1, sd);
    to   = new Date(y, m, sd-1);
  } else {
    from = new Date(y, m-1, 1);                   // 지난달 1일
    to   = new Date(y, m, 0);                     // 지난달 말일
  }
  var f = function(x){ return x.getFullYear()+"-"+pad(x.getMonth()+1)+"-"+pad(x.getDate()); };
  return { from: f(from), to: f(to) };
}
// 그 기간에 이 카드로 쓴 금액
function billedAmount(card, payDate){
  var r = billingRange(card, payDate);
  var sum = 0;
  S.tx.forEach(function(x){
    if(x.type!=="expense" || x.accountId!==card.id) return;
    if(x.date >= r.from && x.date <= r.to) sum += x.amount;
  });
  return sum;
}
// 이 청구 기간에 대해 실제 결제한 금액 (기간 종료일 이후 카드로 들어온 이체)
function paidForPeriod(card, payDate){
  var r=billingRange(card, payDate);
  var sum=0;
  S.tx.forEach(function(x){
    if(x.type!=="transfer" || x.toAccountId!==card.id) return;
    if(x.date > r.to && x.date <= payDate) sum += x.amount;
  });
  return sum;
}
// 오늘 기준으로 이미 지나간 가장 최근 결제일
function prevPayDate(day){
  if(!day) return "";
  var t=new Date(today()+"T00:00:00"), y=t.getFullYear(), m=t.getMonth()+1;
  var d=Math.min(day, dim(y,m));
  if(t.getDate() < d){ m--; if(m<1){m=12;y--;} d=Math.min(day, dim(y,m)); }
  return y+"-"+pad(m)+"-"+pad(d);
}
function nextPayDate(day){
  if(!day) return today();
  var t=new Date(today()+"T00:00:00"), y=t.getFullYear(), m=t.getMonth()+1;
  var d=Math.min(day,dim(y,m));
  if(t.getDate()>d){ m++; if(m>12){m=1;y++;} d=Math.min(day,dim(y,m)); }
  return y+"-"+pad(m)+"-"+pad(d);
}
function monthsBetween(a,b){
  var sa=a.split("-").map(Number), sb=b.split("-").map(Number), o=[], y=sa[0], m=sa[1];
  while(y<sb[0]||(y===sb[0]&&m<=sb[1])){ o.push(y+"-"+pad(m)); m++; if(m>12){m=1;y++;} }
  return o;
}

/* ---------- recurring catch-up ---------- */
function runRecurring(){
  var cur=today().slice(0,7), changed=false, td=today();
  S.rec.forEach(function(r){
    if(!r.active) return;
    var due=monthsBetween(r.startMonth,cur).filter(function(ym){ return r.generatedMonths.indexOf(ym)<0; })
      .map(function(ym){ var p=ym.split("-").map(Number);
        return {ym:ym,date:ym+"-"+pad(Math.min(r.day,dim(p[0],p[1])))}; })
      .filter(function(d){ return d.date<=td; });
    if(!due.length) return;
    due.forEach(function(d){
      var n={id:uid(),amount:r.amount,memo:r.memo,date:d.date,recurringId:r.id,type:r.type};
      if(r.type==="transfer"){ n.fromAccountId=r.fromAccountId; n.toAccountId=r.toAccountId; }
      else { n.category=r.category; n.accountId=r.accountId; }
      S.tx.push(n);
      r.generatedMonths.push(d.ym);
    });
    changed=true;
  });
  if(changed){ save("transactions",S.tx); save("recurring",S.rec); }
}

var HINTS=[
 {w:["스타벅스","카페","커피","이디야","투썸","메가커피","빽다방","컴포즈","김밥","식당","치킨","피자","버거","마라","국밥","분식","배달의민족","요기요","쿠팡이츠","누들","국수","우동","라멘","라면","파스타","돈까스","족발","보쌈","곱창","초밥","횟집","떡볶이","포차","술집","호프","베이커리","제과","밥"],c:"food"},
 {w:["지하철","버스","택시","카카오T","코레일","SRT","주유","칼텍스","에너지","하이패스","톨게이트","주차","렌터카"],c:"transport"},

 {w:["CGV","메가박스","롯데시네마","넷플릭스","왓챠","티빙","스포티파이","유튜브","예스24","교보문고","노래방","PC방"],c:"culture"},
 {w:["쿠팡","11번가","지마켓","옥션","무신사","올리브영","다이소","이마트","홈플러스","롯데마트","편의점","GS25","CU","세븐일레븐","마트","백화점"],c:"shopping"},
 {w:["병원","의원","약국","치과","한의원","피부과","안과","정형외과"],c:"health"},
 {w:["학원","교육","인강","도서","서점","클래스"],c:"education"}

function guessCat(text){
  for(var i=0;i<HINTS.length;i++)
    for(var j=0;j<HINTS[i].w.length;j++)
      if(text.indexOf(HINTS[i].w[j])>=0){
        for(var k=0;k<S.ecats.length;k++) if(S.ecats[k].key===HINTS[i].c) return HINTS[i].c;
      }
  return S.ecats[S.ecats.length-1].key;
}
function parseSms(raw){
  var text=(raw||"").replace(/\[Web발신\]/g," ").trim();
  if(!text) return null;
  var lines=text.split(/[\n\r]+/).map(function(l){return l.replace(/^[\s\-◆■●*\u25A0-\u25FF]+/,"").trim();}).filter(Boolean);

  // 라벨이 붙은 문자(예: "가맹점명 : 스타벅스")면 그 값을 그대로 씁니다
  function labeled(re){
    for(var i=0;i<lines.length;i++){
      var m=lines[i].match(re);
      if(m && m[1] && m[1].trim()) return m[1].trim();
    }
    return "";
  }

  var RE=/([\d]{1,3}(?:,[\d]{3})+|\d{3,})\s*원/g;
  function pick(src){ var o=[],m; RE.lastIndex=0;
    while((m=RE.exec(src))) o.push(parseInt(m[1].replace(/,/g,""),10));
    return o.filter(Boolean); }

  // 금액: 라벨 우선
  var amount=0;
  var amtLabel=labeled(/(?:사용|승인|결제|출금|입금|이용|거래)\s*금액\s*[:：]?\s*(.+)$/);
  if(amtLabel) amount=pick(amtLabel)[0]||0;
  if(!amount){
    var aLine=null;
    for(var i=0;i<lines.length;i++) if(/(출금|입금|승인|결제|이체|사용)/.test(lines[i])&&/원/.test(lines[i])){aLine=lines[i];break;}
    amount=(aLine?pick(aLine):[])[0]||pick(text)[0]||0;
  }
  if(!amount) return null;

  // 취소/입금이면 수입으로
  var type=(/입금|입급/.test(text)&&!/출금/.test(text))||/취소/.test(text)?"income":"expense";

  // 날짜: 라벨 우선, 없으면 본문에서
  var date=today(), now=new Date();
  var dSrc=labeled(/(?:거래시간|거래일시|이용일시|승인일시|이용일자|거래일자)\s*[:：]?\s*(.+)$/)||text;
  var full=dSrc.match(/(20\d{2})[.\-/](\d{1,2})[.\-/](\d{1,2})/)||text.match(/(20\d{2})[.\-/](\d{1,2})[.\-/](\d{1,2})/);
  if(full){ var mo=+full[2],dy=+full[3];
    if(mo>=1&&mo<=12&&dy>=1&&dy<=31) date=full[1]+"-"+pad(mo)+"-"+pad(dy);
  } else {
    var md=dSrc.match(/(\d{1,2})\s*[./월]\s*(\d{1,2})/)||text.match(/(\d{1,2})\s*[./월]\s*(\d{1,2})/);
    if(md){ var mo2=+md[1],dy2=+md[2];
      if(mo2>=1&&mo2<=12&&dy2>=1&&dy2<=31){
        var y=now.getFullYear(); if(mo2>now.getMonth()+1) y--;
        date=y+"-"+pad(mo2)+"-"+pad(dy2);
      } }
  }

  // 상호명: 라벨이 있으면 그것만 신뢰
  var merchant=labeled(/(?:가맹점명|가맹점|이용가맹점|사용처|이용처|거래처)\s*[:：]?\s*(.+)$/);
  if(!merchant){
    var NS=/^(승인|취소|출금|입금|이체|결제|사용|잔액|누적|일시불|할부|안내)/;
    var NL=/(카드|은행|계좌|승인|취소|잔액|누적|고객|회원|손님|성명|한도|현황|종류|시간|일시|일자|금액)/;
    var cands=lines.filter(function(l){ return !/^\[.*\]/.test(l) && !/\d[\d,]*\s*원/.test(l) && /[가-힣A-Za-z]/.test(l); })
      .map(function(l){ return l.replace(/^\d{2,4}[.\-/]\d{1,2}([.\-/]\d{1,2})?\s*/,"").replace(/^\d{1,2}:\d{2}(:\d{2})?\s*/,"").trim(); })
      .filter(function(l){ return l && !/^\d{1,2}:\d{2}/.test(l) && !NS.test(l) && !NL.test(l) && !/님$/.test(l); });
    merchant=cands.length?cands[cands.length-1]:"";
    if(!merchant){
      var a1=text.match(/\d[\d,]*\s*원\s*(.+)$/m); if(a1) merchant=a1[1].trim();
      if(!merchant){ var a2=text.match(/\d{1,2}:\d{2}(?::\d{2})?\s+(.+)$/m); if(a2) merchant=a2[1].trim(); }
    }
  }
  merchant=merchant.replace(/누적.*$/,"").replace(/잔액.*$/,"")
    .replace(/일시불|할부|승인|취소|출금|입금/g,"").replace(/^[^\wㄱ-힣]+|[^\wㄱ-힣]+$/g,"").trim();
  if(merchant.length>24) merchant=merchant.slice(0,24);

  // 카드/계좌: 라벨 우선, 없으면 본문에서 브랜드 추정
  var accountId="";
  var accLabel=labeled(/(?:이용카드|카드명|출금계좌|입금계좌|계좌번호|카드)\s*[:：]?\s*(.+)$/);
  var hay=accLabel||text;
  for(var q=0;q<S.acc.length;q++) if(S.acc[q].name&&text.indexOf(S.acc[q].name)>=0){accountId=S.acc[q].id;break;}
  if(!accountId){
    var br=(hay+" "+text).match(/(국민|신한|삼성|현대|롯데|하나|우리|농협|카카오|토스|BC|IBK|씨티|케이뱅크|새마을|우체국)/);
    if(br){
      var isCheck=/체크/.test(text), isCredit=/신용/.test(text);
      var best=null;
      for(var r2=0;r2<S.acc.length;r2++){
        var a=S.acc[r2];
        if(a.name.indexOf(br[1])<0) continue;
        if(!best) best=a;
        if(isCheck && a.type==="check_card"){ best=a; break; }
        if(isCredit && a.type==="credit_card"){ best=a; break; }
      }
      if(best) accountId=best.id;
    }
  }

  return {type:type,amount:amount,date:date,memo:merchant,accountId:accountId,
          category:type==="expense"?guessCat(merchant+" "+text):"etc_income"};
}
function splitSms(raw){
  function merge(list){
    // 금액이 없는 조각은 앞 조각의 이어진 내용으로 봅니다
    var out=[];
    list.forEach(function(c){
      var hasAmt=/[\d,]{3,}\s*원/.test(c);
      if(!out.length || hasAmt) out.push(c);
      else out[out.length-1]+="\n"+c;
    });
    // 그래도 금액 없는 조각은 버립니다
    return out.filter(function(c){ return /[\d,]{3,}\s*원/.test(c); });
  }
  var b=merge(raw.split(/\n\s*\n+/).map(function(c){return c.trim();}).filter(Boolean));
  if(b.length>1) return b;
  var m=merge(raw.replace(/\n(?=\[)/g,"\u0000").split("\u0000").map(function(c){return c.trim();}).filter(Boolean));
  return m.length?m:[raw];
}

function donut(items,total,centerTop,centerVal){
  if(!total) return "";
  var r=54,ir=38,cx=70,cy=70,ang=-Math.PI/2,out="";
  items.forEach(function(it){
    var frac=it.value/total, a2=ang+frac*Math.PI*2;
    var gap=frac>0.02?0.03:0;
    var s=ang+gap/2,e=a2-gap/2;
    if(e<s) e=s;
    var large=(e-s)>Math.PI?1:0;
    var x1=cx+r*Math.cos(s),y1=cy+r*Math.sin(s),x2=cx+r*Math.cos(e),y2=cy+r*Math.sin(e);
    var x3=cx+ir*Math.cos(e),y3=cy+ir*Math.sin(e),x4=cx+ir*Math.cos(s),y4=cy+ir*Math.sin(s);
    out+='<path d="M'+x1.toFixed(2)+' '+y1.toFixed(2)+' A'+r+' '+r+' 0 '+large+' 1 '+x2.toFixed(2)+' '+y2.toFixed(2)+
      ' L'+x3.toFixed(2)+' '+y3.toFixed(2)+' A'+ir+' '+ir+' 0 '+large+' 0 '+x4.toFixed(2)+' '+y4.toFixed(2)+
      ' Z" fill="'+it.color+'"/>';
    ang=a2;
  });
  return '<div style="position:relative;width:140px;margin:0 auto 16px">'+
    '<svg width="140" height="140" viewBox="0 0 140 140">'+out+'</svg>'+
    '<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">'+
    '<div style="font-size:10.5px;color:var(--inkSoft)">'+esc(centerTop)+'</div>'+
    '<div class="num" style="font-size:17px;font-weight:800;color:var(--down)">'+centerVal+'</div>'+
    '</div></div>';
}
function barChart(data){
  var W=300,H=150,pad=26,bw=data.length?(W-pad)/data.length:0;
  var max=1; data.forEach(function(d){ max=Math.max(max,d.income,d.expense); });
  var bars="",labels="";
  data.forEach(function(d,i){
    var x=pad+i*bw, w=Math.min(9,bw/3);
    var hi=(d.income/max)*(H-30), he=(d.expense/max)*(H-30);
    bars+='<rect x="'+(x+bw/2-w-2).toFixed(1)+'" y="'+(H-20-hi).toFixed(1)+'" width="'+w+'" height="'+Math.max(0,hi).toFixed(1)+'" rx="2.5" fill="var(--up)"/>';
    bars+='<rect x="'+(x+bw/2+2).toFixed(1)+'" y="'+(H-20-he).toFixed(1)+'" width="'+w+'" height="'+Math.max(0,he).toFixed(1)+'" rx="2.5" fill="var(--accent)" opacity=".55"/>';
    labels+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-6)+'" font-size="9" fill="var(--inkSoft)" text-anchor="middle">'+esc(d.label)+'</text>';
  });
  var grid="";
  for(var g=0;g<=2;g++){ var y=H-20-(g/2)*(H-30);
    grid+='<line x1="'+pad+'" y1="'+y.toFixed(1)+'" x2="'+W+'" y2="'+y.toFixed(1)+'" stroke="var(--line)" stroke-width="1"/>';
    grid+='<text x="2" y="'+(y+3).toFixed(1)+'" font-size="8.5" fill="var(--inkSoft)">'+
      (max*g/2>=10000?Math.round(max*g/2/10000)+"만":Math.round(max*g/2))+'</text>'; }
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'">'+grid+bars+labels+'</svg>';
}
function areaChart(pts){
  var W=300,H=140,pad=30;
  var vals=pts.map(function(p){return p.value;});
  var mx=Math.max.apply(null,vals), mn=Math.min.apply(null,vals);
  if(mx===mn){ mx=mx+1; mn=mn-1; }
  var sx=(W-pad-6)/Math.max(1,pts.length-1);
  function Y(v){ return 14+(1-(v-mn)/(mx-mn))*(H-40); }
  var d="",area="";
  pts.forEach(function(p,i){
    var x=pad+i*sx, y=Y(p.value);
    d+=(i?" L":"M")+x.toFixed(1)+" "+y.toFixed(1);
  });
  area=d+" L"+(pad+(pts.length-1)*sx).toFixed(1)+" "+(H-20)+" L"+pad+" "+(H-20)+" Z";
  var labels="";
  pts.forEach(function(p,i){ if(i%2) return;
    labels+='<text x="'+(pad+i*sx).toFixed(1)+'" y="'+(H-5)+'" font-size="8.5" fill="var(--inkSoft)" text-anchor="middle">'+esc(p.label)+'</text>'; });
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'">'+
    '<defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0%" stop-color="var(--accent)" stop-opacity=".3"/>'+
    '<stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>'+
    '<path d="'+area+'" fill="url(#g1)"/>'+
    '<path d="'+d+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>'+
    labels+'</svg>';
}

function budgetCard(list){
  var spent={}, total=0;
  list.forEach(function(x){ if(x.type!=="expense") return;
    spent[x.category]=(spent[x.category]||0)+eAmt(x); total+=eAmt(x); });

  var rows=[];
  if(S.budgets.__total__>0)
    rows.push({name:"전체",used:total,cap:S.budgets.__total__,color:"var(--accent)"});
  // 예산을 정한 분류가 먼저, 그다음 쓴 적 있는 분류
  S.ecats.forEach(function(c){
    if(S.budgets[c.key]>0)
      rows.push({name:c.label,used:spent[c.key]||0,cap:S.budgets[c.key],color:c.color}); });
  var noCap=[];
  S.ecats.forEach(function(c){
    if(!(S.budgets[c.key]>0) && spent[c.key])
      noCap.push({name:c.label,used:spent[c.key],cap:0,color:c.color}); });
  noCap.sort(function(a,b){ return b.used-a.used; });

  if(!rows.length && !noCap.length) return "";

  var h='<div class="card" style="margin-top:14px">'+
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">'+
    '<b style="font-size:13px;font-weight:800">예산</b>'+
    '<button data-budget="1" style="font-size:11.5px;font-weight:700;color:var(--accent)">설정</button></div>';

  rows.forEach(function(r,i){
    var pct=Math.min(100, Math.round(r.used/r.cap*100)), over=r.used>r.cap;
    var left=r.cap-r.used;
    h+='<div style="margin-bottom:14px">'+
      '<div style="display:flex;align-items:baseline;gap:8px;margin-bottom:6px">'+
      '<span style="font-size:13px;font-weight:600">'+esc(r.name)+'</span>'+
      '<span style="flex:1"></span>'+
      '<span class="num" style="font-size:12px;color:'+(over?"var(--down)":"var(--inkSoft)")+';font-weight:600">'+
        (over?"초과 "+won(-left):"남음 "+won(left))+'</span></div>'+
      '<div class="bar"><i style="width:'+pct+'%;background:'+(over?"var(--down)":r.color)+'"></i></div>'+
      '<div style="display:flex;justify-content:space-between;margin-top:5px">'+
      '<span class="num" style="font-size:10.5px;color:var(--inkSoft)">'+won(r.used)+' / '+won(r.cap)+'</span>'+
      '<span class="num" style="font-size:10.5px;color:'+(over?"var(--down)":"var(--inkSoft)")+'">'+pct+'%</span>'+
      '</div></div>';
  });

  // 예산을 정하지 않았지만 쓴 분류 — 얼마 썼는지만 보여줍니다
  if(noCap.length){
    if(rows.length)
      h+='<div style="font-size:11px;color:var(--inkSoft);font-weight:700;'+
        'margin:4px 0 9px;padding-top:12px;border-top:1px solid var(--line)">예산 없이 쓴 분류</div>';
    noCap.forEach(function(r,i){
      h+='<div style="display:flex;align-items:center;gap:9px;margin-bottom:'+
        (i===noCap.length-1?0:9)+'px">'+
        '<span style="width:7px;height:7px;border-radius:999px;background:'+r.color+';flex-shrink:0"></span>'+
        '<span style="font-size:12.5px;font-weight:600">'+esc(r.name)+'</span>'+
        '<span style="flex:1"></span>'+
        '<span class="num" style="font-size:12.5px;font-weight:700;color:var(--inkMid)">'+won(r.used)+'</span>'+
        '</div>';
    });
  }
  return h+'</div>';
}

function accMonthTx(a){
  var n=new Date(), t=new Date(n.getFullYear(), n.getMonth()+S.accMOff, 1);
  var ym=t.getFullYear()+"-"+pad(t.getMonth()+1);
  var out=[];
  S.tx.forEach(function(x){
    if(x.date.slice(0,7)!==ym) return;
    var mine=false;
    if(x.type==="transfer") mine = x.fromAccountId===a.id||x.toAccountId===a.id;
    else if(x.accountId===a.id) mine=true;
    else {
      // 연결된 체크카드로 쓴 것도 통장 쪽에서 함께 보여줍니다
      var src=accById(x.accountId);
      mine = !!(src && linkedCheck(src) && src.linkedAccountId===a.id);
    }
    if(mine) out.push(x);
    var st=stlOf(x);
    if(st && st.got && st.accountId===a.id && x.accountId!==a.id)
      out.push(Object.assign({},x,{_stlIn:true}));
  });
  return out.sort(function(p,q){ return p.date<q.date?1:-1; });
}

      var owed=-(b[a.id]||0);
      var due=a.payDay?nextPayDate(a.payDay):"";
      var dd=due?daysUntil(due):null;
      var billed=a.payDay?billedAmount(a,due):0;
      var rng=a.payDay?billingRange(a,due):null;
      // 청구 기간이 아직 안 끝났으면 금액이 더 늘어날 수 있습니다
      var openPeriod = rng ? (rng.to >= today()) : false;
      var paid = a.payDay ? paidForPeriod(a, due) : 0;
      var diff = billed - paid;          // 할인·캐시백 등으로 덜 냈으면 양수
      // 이미 지나간 결제일의 청구분 — 아직 기록하지 않았을 수 있습니다
      var prevDue  = a.payDay ? prevPayDate(a.payDay) : "";
      var prevBill = prevDue ? billedAmount(a, prevDue) : 0;
      var prevPaid = prevDue ? paidForPeriod(a, prevDue) : 0;
      var prevRng  = prevDue ? billingRange(a, prevDue) : null;
      var prevSeparate = prevDue && prevDue !== due && prevBill > 0;
      var prevOpen = prevSeparate && prevPaid === 0;
      var prevDiff = prevBill - prevPaid;
      h+='<div style="margin-top:12px;padding:12px 13px;background:var(--bg);border-radius:12px">'+
        '<div style="display:flex;align-items:center;gap:10px">'+
        '<div style="flex:1;min-width:0">'+
        '<div style="font-size:11.5px;font-weight:700;color:var(--inkMid)">'+
        (a.payDay?("결제일 D-"+dd+" · 매달 "+a.payDay+"일"):"결제일 미설정")+'</div>'+
        (rng?'<div class="num" style="font-size:10.5px;color:var(--inkSoft);margin-top:3px">'+
          esc(rng.from.slice(5).replace("-","."))+' ~ '+esc(rng.to.slice(5).replace("-","."))+' 사용분'+
          (openPeriod?'<span style="color:var(--accent);font-weight:700"> · 집계 중</span>':'')+
          '</div>':'')+
        '</div>'+
        (a.payDay?'<div style="text-align:right"><div style="font-size:10px;color:var(--inkSoft);font-weight:600">'+
          (openPeriod?"현재까지":"결제 예정")+'</div>'+
          '<div class="num" style="font-size:15px;font-weight:800;color:var(--down);margin-top:2px">'+
          mask(billed,1)+'</div></div>':'')+
        '</div>';
      if(a.payDay && paid>0){
        h+='<div style="margin-top:10px;padding-top:9px;border-top:1px solid var(--line)">'+
          '<div style="display:flex;align-items:baseline;gap:8px">'+
          '<span style="font-size:11.5px;font-weight:700;color:var(--up)">결제 완료</span>'+
          '<span style="flex:1"></span>'+
          '<span class="num" style="font-size:13px;font-weight:700">'+mask(paid,1)+'</span>'+
          '<span style="font-size:10.5px;color:var(--inkSoft)">원</span></div>';
        if(diff>0)
          h+='<div style="display:flex;align-items:center;gap:8px;margin-top:8px">'+
            '<span style="font-size:11px;color:var(--inkSoft);flex:1">청구액보다 '+won(diff)+'원 적게 냈어요</span>'+
            '<button class="mini" data-carddisc="'+a.id+'|'+diff+'" style="color:var(--accent);'+
            'padding:6px 11px">할인으로 처리</button></div>';
        else if(diff<0)
          h+='<div style="font-size:11px;color:var(--inkSoft);margin-top:6px">'+
            '청구액보다 '+won(-diff)+'원 더 냈어요</div>';
        h+='</div>';
      }
      else if(a.payDay && billed>0 && !openPeriod)
        h+='<button class="mini" data-paycard="'+a.id+'" style="width:100%;margin-top:10px;'+
          'background:var(--accent);color:#fff;padding:10px">결제하기</button>';
      else if(a.payDay && openPeriod)
        h+='<div style="font-size:11px;color:var(--inkSoft);line-height:1.6;margin-top:8px">'+
          esc(rng.to.slice(5).replace("-","."))+'까지 쓴 만큼 '+a.payDay+'일에 청구돼요. 아직 늘어날 수 있어요.</div>';

      // 지난 결제일 청구분을 아직 기록하지 않았다면
      if(prevOpen)
        h+='<div style="margin-top:10px;padding-top:9px;border-top:1px solid var(--line)">'+
          '<div style="display:flex;align-items:baseline;gap:8px">'+
          '<span style="font-size:11.5px;font-weight:700;color:var(--down)">지난 청구 미기록</span>'+
          '<span style="flex:1"></span>'+
          '<span class="num" style="font-size:13px;font-weight:700">'+mask(prevBill,1)+'</span>'+
          '<span style="font-size:10.5px;color:var(--inkSoft)">원</span></div>'+
          '<div class="num" style="font-size:10.5px;color:var(--inkSoft);margin-top:3px">'+
            esc(prevRng.from.slice(5).replace("-","."))+' ~ '+esc(prevRng.to.slice(5).replace("-","."))+
            ' 사용분 · '+esc(prevDue.slice(5).replace("-","."))+' 결제일</div>'+
          '<button class="mini" data-paycard="'+a.id+'|prev" style="width:100%;margin-top:9px;'+
            'background:var(--accent);color:#fff;padding:10px">이 청구분 결제 기록하기</button>'+
          '</div>';
      // 지난 청구를 이미 결제했다면 결과를 보여줍니다
      else if(prevSeparate && prevPaid > 0)
        h+='<div style="margin-top:10px;padding-top:9px;border-top:1px solid var(--line)">'+
          '<div style="display:flex;align-items:baseline;gap:8px">'+
          '<span style="font-size:11.5px;font-weight:700;color:var(--up)">지난 청구 결제 완료</span>'+
          '<span style="flex:1"></span>'+
          '<span class="num" style="font-size:13px;font-weight:700">'+mask(prevPaid,1)+'</span>'+
          '<span style="font-size:10.5px;color:var(--inkSoft)">원</span></div>'+
          (prevDiff>0
            ? '<div style="display:flex;align-items:center;gap:8px;margin-top:8px">'+
              '<span style="font-size:11px;color:var(--inkSoft);flex:1">청구액보다 '+won(prevDiff)+'원 적게 냈어요</span>'+
              '<button class="mini" data-carddisc="'+a.id+'|'+prevDiff+'" style="color:var(--accent);'+
              'padding:6px 11px">할인으로 처리</button></div>'
            : prevDiff<0
            ? '<div style="font-size:11px;color:var(--inkSoft);margin-top:6px">청구액보다 '+won(-prevDiff)+'원 더 냈어요</div>'
            : '')+
          '</div>';
      else if(!a.payDay)
        h+='<div style="font-size:11px;color:var(--inkSoft);margin-top:6px">'+
          '수정에서 결제일을 정하면 예정 금액을 계산해드려요.</div>';
      if(owed>0 && billed!==owed)
        h+='<div class="num" style="font-size:10.5px;color:var(--inkSoft);margin-top:8px;'+
          'padding-top:8px;border-top:1px solid var(--line)">미결제 총액 '+mask(owed,1)+'원</div>';
      h+='</div>';
    }


    // ---- 이 자산의 월별 거래 ----
    var mt=accMonthTx(a), mi=0, me=0;
    mt.forEach(function(x){
      if(x._stlIn) mi+=x.settle.got;
      else if(x.type==="income") mi+=x.amount;
      else if(x.type==="expense") me+=x.amount;
    });
    h+='<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)">'+
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">'+
      '<button class="mini" data-accmon="-1" style="padding:5px 9px">'+svg("left",13)+'</button>'+
      '<div style="text-align:center">'+
        '<div style="font-size:12px;font-weight:700">'+accMonthLabel()+'</div>'+
        '<div class="num" style="font-size:10.5px;color:var(--inkSoft);margin-top:2px">'+
          (me?'<span style="color:var(--down)">-'+won(me)+'</span>':'')+
          (me&&mi?' · ':'')+
          (mi?'<span style="color:var(--up)">+'+won(mi)+'</span>':'')+
          (!me&&!mi?'거래 없음':'')+
        '</div></div>'+
      '<button class="mini" data-accmon="1" style="padding:5px 9px">'+svg("right",13)+'</button>'+
      '</div>';
    if(mt.length){
      h+='<div style="background:var(--bg);border-radius:12px;padding:2px 12px">';
      mt.forEach(function(x,i){ h+=accTxRow(x,a,i===mt.length-1); });
      h+='</div>';
    } else {
      h+='<div style="text-align:center;font-size:12px;color:var(--inkSoft);padding:14px 0">'+
        '이 달에는 사용 기록이 없어요.</div>';
    }
    h+='</div>';

    h+='<div style="display:flex;align-items:center;gap:6px;margin-top:12px">'+
      '<button class="mini" data-accedit="'+a.id+'">수정</button>'+
      '<button class="mini" data-accdel="'+a.id+'" style="color:var(--down)">삭제</button><span style="flex:1"></span>';
    h+='</div></div>';
  }
  return h+'</div>';
}

function sheet(title, inner){
  return '<div class="mask" data-mask="1"><div class="sheet" data-stop="1"><div class="grab"></div>'+
    '<div class="shd"><b>'+esc(title)+'</b><button class="xb" data-close="1">'+svg("x",16)+'</button></div>'+

}

function mTx(){
  var isEdit=!!M.editId, isT=M.type==="transfer";

  var transferable=S.acc.filter(function(a){ return !linkedCheck(a); });
  var h='<div class="seg" style="margin-bottom:20px">';

    '<div id="amtsub" style="text-align:center;font-size:12px;color:var(--inkSoft);margin-bottom:10px">'+

      '<button class="opb" data-op="+">＋</button>'+
      '<button class="opb" data-op="-">－</button>'+
      '<button class="opb" data-op="*">×</button>'+

    '</div>';

  if(isT){
    if(transferable.length<2) h+='<div class="lb">자산</div><div style="background:var(--bg);border-radius:12px;padding:13px;font-size:12.5px;color:var(--inkSoft);line-height:1.5;margin-bottom:16px">이체하려면 잔액을 가진 자산이 2개 이상 필요해요.</div>';
    else{
      [["from","보내는 자산"],["to","받는 자산"]].forEach(function(r){
        h+='<div class="lb">'+r[1]+'</div><div class="chips" style="margin-bottom:14px">';
        transferable.forEach(function(a){
          var on=M[r[0]]===a.id, dim2=M[r[0]==="from"?"to":"from"]===a.id;
          h+='<button class="chip '+(on?"on":"")+'" data-m'+r[0]+'="'+a.id+'" style="opacity:'+(dim2?.35:1)+'">'+esc(a.name)+'</button>'; });
        h+='</div>'; });
    }
  } else {
    h+='<div class="lb">'+(M.type==="expense"?"결제 수단":"입금 계좌")+'</div>';
    if(!S.acc.length) h+='<div style="background:var(--bg);border-radius:12px;padding:13px;font-size:12.5px;color:var(--inkSoft);line-height:1.5;margin-bottom:16px">자산 탭에서 통장이나 카드를 추가하면 잔액에 반영돼요.</div>';
    else{ h+='<div class="chips" style="margin-bottom:16px">';
      accByRecent().forEach(function(a){ h+='<button class="chip '+(M.acc===a.id?"on":"")+'" data-macc="'+a.id+'">'+esc(a.name)+'</button>'; });
      h+='</div>'; }
    h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:9px">'+
      '<span class="lb" style="margin:0">분류</span>'+
      '<button data-editcats="'+M.type+'" style="font-size:11.5px;font-weight:700;color:var(--accent)">편집</button></div>';
    h+='<div class="cgrid" style="margin-bottom:18px">';
    cats.forEach(function(c){
      var on=M.cat===c.key;
      h+='<button class="cbtn" data-mcat="'+c.key+'" style="background:'+(on?c.color:c.color+"22")+';color:'+(on?"#fff":c.color)+'">'+
        svg(c.icon,17,on?"#fff":c.color)+'<span>'+esc(c.label)+'</span></button>'; });
    h+='</div>';
  }
  h+='<div class="lb">날짜</div><input class="fld" type="date" id="dt" value="'+M.date+'">';
  var linkedRec = M.editId ? S.rec.filter(function(r){ return r.id===M.recurringId; })[0] : null;
  h+='<button class="tog '+(M.rep?"on":"")+'" data-mrep="1">'+svg("repeat",16,M.rep?"var(--accent)":"var(--inkSoft)")+

    '<div style="font-size:11px;color:var(--inkSoft);margin-top:1px">'+

    h+='<div style="font-size:11px;color:var(--inkSoft);line-height:1.6;margin:-8px 0 14px 2px">'+

  h+='<div class="lb">제목</div>'+
     '<input class="fld" id="memo" autocomplete="off" placeholder="'+
     (isT?"예: 생활비 이체":"예: 점심 김치찌개")+'" value="'+esc(M.memo)+'">'+
     '<div id="sugg">'+suggestHtml()+'</div>';
  h+='<div class="lb">메모 <span style="font-weight:500;color:var(--inkSoft)">(내역에는 안 보여요)</span></div>'+
     '<textarea class="fld" id="note" rows="2" placeholder="자세한 내용을 남겨두세요">'+esc(M.note||"")+'</textarea>'+
     '<div style="font-size:11px;color:var(--inkSoft);line-height:1.6;margin:-4px 0 14px 2px">'+
     '#아메리카노 처럼 태그를 달면 검색에서 모아볼 수 있어요.</div>';
  if(!isT && M.type==="expense") h+=stlEntryHtml();
  var bad=isT&&(!M.from||!M.to||M.from===M.to);
  h+='<button class="go" id="save" '+((!M.amount||bad)?"disabled":"")+'>'+
    (isEdit?"수정하기":M.rep?"반복 기록 시작하기":isT?"이체하기":"기록하기")+'</button>';
  return sheet(isEdit?"거래 수정":M.pre?"내용 확인":"새 거래",h);
}

/* ---------- 정산 ---------- */
// 돌려받을 자산 기본값: 카페머니 → 현금 → 카드가 아닌 첫 자산
function stlDefaultAcc(){
  var pick=null;
  S.acc.forEach(function(a){
    if(pick) return;
    if(a.name.replace(/\s/g,"").indexOf("카페머니")>=0) pick=a.id; });
  if(!pick) S.acc.forEach(function(a){
    if(pick) return;
    if(a.name.indexOf("현금")>=0) pick=a.id; });
  if(!pick){ var L=stlAccList(); if(L.length) pick=L[0].id; }
  return pick||"";
}
function stlAccList(){
  var usable=S.acc.filter(function(a){ return !linkedCheck(a); });
  var plain=usable.filter(function(a){ return !isCredit(a); });
  var cards=usable.filter(function(a){ return isCredit(a); });
  return plain.concat(cards);
}
function stlEntryHtml(){
  var st=M.stlData;
  if(st) {
    var a=accById(st.accountId);
    return '<div class="tog" style="cursor:default">'+svg("people",16,"var(--accent)")+
      '<div style="flex:1"><div style="font-size:13.5px;font-weight:600;color:var(--accent)">정산 완료</div>'+
      '<div style="font-size:11px;color:var(--inkSoft);margin-top:2px;line-height:1.5">'+
      '내 몫 '+won(st.mine)+'원 · '+won(st.got)+'원을 '+esc(a?a.name:"미지정")+'(으)로 받았어요</div></div>'+
      '<button data-stlclear="1" style="font-size:11.5px;font-weight:700;color:var(--down);padding:4px 2px">해제</button></div>'+
      '<div style="height:16px"></div>';
  }
  return '<button class="tog" data-stlopen="1">'+svg("people",16,"var(--inkSoft)")+
    '<div style="flex:1"><div style="font-size:13.5px;font-weight:600">정산 받기</div>'+
    '<div style="font-size:11px;color:var(--inkSoft);margin-top:1px;line-height:1.5">'+
    '대표로 결제하고 일부를 돌려받았다면, 내 몫만 지출로 잡아요</div></div>'+
    svg("right",15,"var(--inkSoft)")+'</button><div style="height:16px"></div>';
}
function stlTotal(){ return M.stlTotal||0; }
function stlNum(v){ return parseInt(String(v||"").replace(/[^0-9]/g,""),10)||0; }
function stlNoteHtml(){
  var tot=stlTotal(), mine=stlNum(M.mine), got=stlNum(M.got), gap=tot-mine-got;
  if(!mine && !got)
    return '<div class="stlnote stlok">한 칸만 넣으면 나머지는 자동으로 채워져요.</div>';
  if(gap===0)
    return '<div class="stlnote stlok">딱 맞아요. 내 몫 '+won(mine)+'원만 지출로 잡혀요.</div>';
  if(gap>0)
    return '<div class="stlnote stlwarn">'+won(gap)+'원이 아직 안 걷혔어요. 그대로 저장해도 돼요.</div>';
  return '<div class="stlnote stlwarn">결제한 금액보다 '+won(-gap)+'원 많아요. 다시 확인해 주세요.</div>';
}

function mSmart(){
  if(M.batch){

function suggestList(){
  if(!M || M.editId || M.pre) return [];
  var q=(M.memo||"").trim().toLowerCase();
  var seen={}, out=[];
  for(var i=S.tx.length-1; i>=0 && out.length<5; i--){
    var x=S.tx[i];
    if(x.type!==M.type || !x.memo) continue;
    if(q && x.memo.toLowerCase().indexOf(q)<0) continue;
    if(q && x.memo.trim().toLowerCase()===q) continue;   // 이미 똑같이 쳤으면 제외
    var k=x.memo+"|"+x.amount;
    if(seen[k]) continue;
    seen[k]=1; out.push(x);
  }
  return out;
}
function suggestHtml(){
  var list=suggestList();

function amtSubHtml(){
  if(!M || !M.calc || !M.calc.length) return "원";
  var parts = M.calc.map(function(t,i){
    return (i===0 ? "" : (t.op==="-" ? " − " : " + ")) + won(t.v);
  }).join("");

  if(cur) parts += (M.pendingOp==="-" ? " − " : " + ") + won(cur);

}
function calcTotal(){
  if(!M || !M.calc) return parseInt(M.amount,10)||0;
  var sum = 0;
  M.calc.forEach(function(t){ sum += (t.op==="-" ? -t.v : t.v); });
  var cur = parseInt(M.amount,10)||0;
  if(cur) sum += (M.pendingOp==="-" ? -cur : cur);
  return sum;
}
// 금액칸에 12000+5000 처럼 식을 직접 칠 수 있습니다.
// 숫자와 + - * / 만 남기고 곱셈·나눗셈을 먼저 계산합니다.
function amtClean(str){
  return String(str==null?"":str).replace(/[^0-9+\-*/.]/g, "");
}
function amtEval(expr){
  var e = amtClean(expr);
  if(!e) return null;
  e = e.replace(/[+\-*/.]+$/, "");          // 끝에 걸린 연산자는 무시
  if(!e) return null;
  var nums = e.split(/[+\-*/]/).filter(function(x){ return x!==""; });
  if(!nums.length) return null;
  var vals = nums.map(Number);
  var o = e.replace(/[0-9.]/g, "").split("").filter(function(x){ return x!==""; });
  for(var i=0; i<o.length; ){
    if(o[i]==="*" || o[i]==="/"){
      var r = o[i]==="*" ? vals[i]*vals[i+1] : (vals[i+1] ? vals[i]/vals[i+1] : 0);
      vals.splice(i, 2, r); o.splice(i, 1);
    } else i++;
  }
  var sum = vals[0]||0;
  for(var j=0; j<o.length; j++) sum = (o[j]==="-") ? sum-(vals[j+1]||0) : sum+(vals[j+1]||0);
  return Math.round(sum);
}
function amtHasOp(){
  return !!(M && /[+\-*/]/.test(amtClean(M.amount).slice(1)));
}
// 화면에 보일 금액칸 값 — 식이면 그대로, 단순 숫자면 자릿수를 넣습니다
function amtDisplay(){
  if(!M) return "";
  var raw = amtClean(M.amount);
  if(!raw) return "";
  if(amtHasOp()) return raw;
  var n = parseInt(raw, 10);
  return isNaN(n) ? "" : n.toLocaleString("ko-KR");
}
// 금액칸 아래 줄 — 식이면 결과를, 아니면 "원"
function amtSubHtml(){
  if(!M || !amtHasOp()) return "원";
  var total = amtEval(M.amount);
  if(total===null) return "원";
  return '<span class="num" style="font-weight:800;color:var(--ink)">= '+won(total)+'</span>원';
}

// 분류별 합계 요약 — 입력할 때마다 이 부분만 갈아끼웁니다 (포커스 유지)
function budgetSumHtml(){
  if(!M || !M.vals) return "";
  var catSum=0;
  S.ecats.forEach(function(c){ catSum += parseInt(M.vals[c.key],10)||0; });
  var total = parseInt(M.vals.__total__,10)||0;
  var h="";
  if(catSum>0){
    var diff = total - catSum;
    h+='<div style="background:var(--bg);border-radius:12px;padding:13px 14px;margin-top:4px">'+
      '<div style="display:flex;align-items:baseline;gap:8px">'+
      '<span style="font-size:12.5px;font-weight:700">분류 합계</span>'+
      '<span style="flex:1"></span>'+
      '<span class="num" style="font-size:14px;font-weight:800">'+won(catSum)+'</span>'+
      '<span style="font-size:11.5px;color:var(--inkSoft)">원</span></div>';
    if(total>0){
      h+='<div style="display:flex;align-items:baseline;gap:8px;margin-top:7px;padding-top:7px;'+
        'border-top:1px solid var(--line)">'+
        '<span style="font-size:11.5px;color:var(--inkMid)">전체 예산 '+won(total)+'원</span>'+
        '<span style="flex:1"></span>'+
        '<span class="num" style="font-size:11.5px;font-weight:700;color:'+
          (diff<0?"var(--down)":"var(--up)")+'">'+
          (diff<0 ? won(-diff)+"원 초과" : diff>0 ? won(diff)+"원 남음" : "딱 맞음")+
        '</span></div>';
    }
    h+='</div>';
  }
  return h;
}
// 분류 세부 내역 — 자산 상세처럼 달을 넘겨볼 수 있습니다
function mCatDetail(){
  var key=M.catKey;
  var c=cat("expense",key);
  var n=new Date(), t=new Date(n.getFullYear(), n.getMonth()+M.mOff, 1);
  var ym=t.getFullYear()+"-"+pad(t.getMonth()+1);
  var lbl=t.getFullYear()+". "+pad(t.getMonth()+1);

  var mine=S.tx.filter(function(x){
    return x.type==="expense" && x.category===key && x.date.slice(0,7)===ym;
  }).sort(function(a,b){ return a.date<b.date?1:-1; });
  var total=mine.reduce(function(s2,x){ return s2+eAmt(x); },0);

  // 보고 있는 달을 가운데 두고 앞뒤로 6개월을 보여줍니다.
  // (선택한 달 뒤쪽도 보이도록 오른쪽에 2칸을 남깁니다)
  var right = M.mOff + 2;
  var left  = right - 5;
  var nowD=new Date();
  var bars=[];
  for(var i=left; i<=right; i++){
    var d=new Date(nowD.getFullYear(), nowD.getMonth()+i, 1);
    var k=d.getFullYear()+"-"+pad(d.getMonth()+1);
    var v=0;
    S.tx.forEach(function(x){
      if(x.type==="expense" && x.category===key && x.date.slice(0,7)===k) v+=eAmt(x); });
    bars.push({label:(d.getMonth()+1)+"", value:v, now:k===ym, off:i});
  }
  var mx=1; bars.forEach(function(b){ mx=Math.max(mx,b.value); });

  var h='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">'+
    '<button class="mini" data-catmon="-1" style="padding:6px 10px">'+svg("left",14)+'</button>'+
    '<div style="text-align:center">'+
      (M.mOff===0
        ? '<div style="font-size:13px;font-weight:700">'+esc(lbl)+'</div>'
        : '<button data-catgo="0" style="font-size:13px;font-weight:700;display:flex;'+
          'align-items:center;gap:5px">'+esc(lbl)+
          '<span style="font-size:10px;font-weight:600;color:var(--accent);'+
          'background:var(--accentSoft);padding:2px 6px;border-radius:999px">이번 달로</span></button>')+
      '<div class="num" style="font-size:17px;font-weight:800;color:'+c.color+';margin-top:3px">'+
        won(total)+'<span style="font-size:12px;font-weight:600">원</span></div>'+
      '<div style="font-size:11px;color:var(--inkSoft);margin-top:2px">'+mine.length+'건</div>'+
    '</div>'+
    '<button class="mini" data-catmon="1" style="padding:6px 10px">'+svg("right",14)+'</button>'+
    '</div>';

  // 월별 막대
  // 12개월을 담고 화면에는 6개씩 — 옆으로 밀어 나머지를 봅니다
  h+='<div class="barrow">';
  bars.forEach(function(b){
    var ht=Math.max(3, Math.round(b.value/mx*54));
    h+='<button data-catgo="'+b.off+'" aria-label="'+b.label+'월 보기" '+
      'class="barcol'+(b.now?" now":"")+'">'+
      '<div class="barfill" style="height:'+ht+'px;background:'+c.color+(b.now?"":"55")+'"></div>'+
      '<span class="barlbl">'+b.label+'</span></button>';
  });
  h+='</div>';

  if(!mine.length){
    h+='<div style="text-align:center;font-size:13px;color:var(--inkSoft);padding:22px 0">'+
      '이 달에는 기록이 없어요.</div>';
  } else {
    h+='<div class="list" style="border-radius:14px">';
    mine.forEach(function(x){ h+=txRow(x); });
    h+='</div>';
  }
  return sheet(c.label, h);
}
function mTag(){
  var tag=M.tag;
  var res=S.tx.filter(function(x){ return tagsOf(x).indexOf(tag)>=0; })
    .sort(function(a,b){ return a.date<b.date?1:-1; });
  var exp=0, inc=0, byMonth={};
  res.forEach(function(x){
    if(x.type==="expense") exp+=eAmt(x); else if(x.type==="income") inc+=x.amount;
    if(x.type!=="transfer"){
      var ym=x.date.slice(0,7);
      byMonth[ym]=(byMonth[ym]||0)+(x.type==="expense"?eAmt(x):-x.amount);
    }
  });
  var months=Object.keys(byMonth).sort().slice(-6);
  var avg=res.length?Math.round(exp/Math.max(1,months.length)):0;

  var h='<div style="display:flex;gap:14px;padding:14px;background:var(--bg);border-radius:14px;margin-bottom:14px">'+
    '<div><div style="font-size:10.5px;color:var(--inkSoft);font-weight:600">건수</div>'+
    '<div class="num" style="font-size:15px;font-weight:800;margin-top:3px">'+res.length+'</div></div>'+
    '<div><div style="font-size:10.5px;color:var(--inkSoft);font-weight:600">합계</div>'+
    '<div class="num" style="font-size:15px;font-weight:800;color:var(--down);margin-top:3px">'+won(exp)+'</div></div>'+
    (months.length>1?'<div><div style="font-size:10.5px;color:var(--inkSoft);font-weight:600">월평균</div>'+
    '<div class="num" style="font-size:15px;font-weight:800;margin-top:3px">'+won(avg)+'</div></div>':'')+
    (inc?'<div><div style="font-size:10.5px;color:var(--inkSoft);font-weight:600">수입</div>'+
    '<div class="num" style="font-size:15px;font-weight:800;color:var(--up);margin-top:3px">'+won(inc)+'</div></div>':'')+
    '</div>';

  if(months.length>1){
    var mx=1; months.forEach(function(m){ mx=Math.max(mx,Math.abs(byMonth[m])); });
    h+='<div style="margin-bottom:16px">';
    months.forEach(function(m, mi){
      var v=Math.abs(byMonth[m]);
      h+='<div style="display:flex;align-items:center;gap:9px;margin-bottom:7px">'+
        '<span style="width:42px;font-size:11px;color:var(--inkSoft);flex-shrink:0">'+(+m.slice(5))+'월</span>'+
        '<span class="bar" style="flex:1"><i style="width:'+(v/mx*100)+'%;background:var(--accent)"></i></span>'+
        '<span class="num" style="width:70px;text-align:right;font-size:11.5px;font-weight:600">'+won(v)+'</span></div>';
    });
    h+='</div>';
  }

  if(!res.length) h+='<div style="padding:26px 0;text-align:center;font-size:13px;color:var(--inkSoft)">이 태그가 붙은 기록이 없어요.</div>';
  else{
    h+='<div class="list" style="border-radius:14px">';
    res.slice(0,60).forEach(function(x){ h+=txRow(x); });
    h+='</div>';
    if(res.length>60) h+='<div style="text-align:center;font-size:11.5px;color:var(--inkSoft);padding:10px 0">최근 60건만 보여드려요</div>';
  }
  return sheet("#"+tag,h);
}
function mSearch(){

  // 기간 필터
  var per=M.per||"all";
  if(per==="custom"){
    if(M.from) res=res.filter(function(x){ return x.date>=M.from; });
    if(M.to) res=res.filter(function(x){ return x.date<=M.to; });
  } else if(per!=="all"){
    var now=new Date(today()+"T00:00:00"), from=null;
    if(per==="thism") from=new Date(now.getFullYear(),now.getMonth(),1);
    else if(per==="thisy") from=new Date(now.getFullYear(),0,1);

      res=res.filter(function(x){ return x.date>=fs; });

  if(q){
    var lq=q.toLowerCase();

      var c=x.type==="transfer"?null:cat(x.type,x.category);

    h+='<button class="chip '+(M.ftype===t[0]?"on":"")+'" data-fty="'+t[0]+'">'+t[1]+'</button>'; });

  h+='<div class="chips" style="margin-bottom:10px">';
  [["all","전체 기간"],["thism","이번 달"],["thisy","올해"],["custom","직접 지정"]].forEach(function(t){
    h+='<button class="chip '+(per===t[0]?"on":"")+'" data-fper="'+t[0]+'">'+t[1]+'</button>'; });
  h+='</div>';
  if(per==="custom"){
    h+='<div style="display:flex;align-items:center;gap:6px;margin-bottom:12px">'+
      '<input class="fld dt" type="date" id="fromd" value="'+esc(M.from||"")+'">'+
      '<span style="font-size:12px;color:var(--inkSoft);flex:0 0 auto">~</span>'+
      '<input class="fld dt" type="date" id="tod" value="'+esc(M.to||"")+'">'+
      '</div>';
    if(M.from&&M.to&&M.from>M.to)
      h+='<div style="font-size:11.5px;color:var(--down);font-weight:600;margin:-6px 0 12px 2px">시작일이 종료일보다 늦어요.</div>';

// 시트 내부만 교체 — 스크롤 위치와 입력 포커스를 지킵니다
function repaintSheet(){
  var host=document.getElementById("sheetHost");
  if(!host || !M) { render(); return; }
  var sc=host.querySelector ? host.querySelector(".sheet") : null;
  var top=sc?sc.scrollTop:0;
  var chipScroll=[];
  if(sc && sc.querySelectorAll){
    var cs=sc.querySelectorAll(".chips");
    for(var i=0;i<cs.length;i++) chipScroll.push(cs[i].scrollLeft);
  }
  host.innerHTML=sheetHtml();
  var sc2=host.querySelector ? host.querySelector(".sheet") : null;
  if(sc2){
    sc2.scrollTop=top;
    if(sc2.querySelectorAll){
      var cs2=sc2.querySelectorAll(".chips");
      for(var j=0;j<cs2.length && j<chipScroll.length;j++) cs2[j].scrollLeft=chipScroll[j];
    }
  }
}

/* ---------- persistence helpers ---------- */
function saveAll(){ save("transactions",S.tx); save("accounts",S.acc); save("recurring",S.rec);
  save("expenseCats",S.ecats); save("incomeCats",S.icats); }

/* ---------- events ---------- */
document.addEventListener("click",function(ev){
  var el=ev.target.closest?ev.target.closest("[data-tab],[data-nav],[data-per],[data-theme],[data-smart],[data-new],[data-edit],[data-del],[data-mask],[data-close],[data-mtype],[data-macc],[data-mcat],[data-mfrom],[data-mto],[data-mrep],[data-editcats],[data-grp],[data-acc],[data-accopen],[data-accedit],[data-accdel],[data-accmv],[data-atype],[data-alink],[data-asave],[data-rtog],[data-rdel],[data-cats],[data-exp],[data-imp],[data-smsgo],[data-bt],[data-bback],[data-bsave],[data-cmv],[data-cedit],[data-cdel],[data-cnew],[data-cicon],[data-ccol],[data-ccommit],[data-csave],[data-quick],[data-search],[data-fty],[data-fcat],[data-budget],[data-bsaveall],[data-paycard],[data-settings],[data-tag],[data-copybk],[data-bedit],[data-fper],[data-wipetx],[data-wipeall],[data-hidetot],[data-accmon],[data-changelog],[data-op],[data-hf],[data-catdet],[data-catmon],[data-recur],[data-redit],[data-rtogm],[data-rcat],[data-racc],[data-rfrom],[data-rto],[data-rsave],[data-rnew],[data-rtype],[data-acyc],[data-catgo],[data-carddisc],[data-stlopen],[data-stlclear],[data-stlacc],[data-stlsave],#save"):null;
  if(!el) return;
  var d=el.dataset||{};

  if(el.id==="save"){ commitTx(); return; }
  if(d.mask!==undefined && ev.target===el){ M=(M&&M.back)||null; render(); return; }
  if(d.close!==undefined){ M=(M&&M.back)||null; render(); return; }
  if(d.tab){ S.tab=d.tab; S.openAcc=null; render(); return; }
  if(d.nav){ var k=d.nav[0], dir=parseInt(d.nav.slice(1),10);
    if(k==="m") S.mOff+=dir; else S.yOff+=dir; render(); return; }
  if(d.per){ S.period=d.per; render(); return; }
  if(d.settings!==undefined){ M={settings:true}; render(); return; }
  if(d.changelog!==undefined){ M={changelog:true,back:{settings:true}}; render(); return; }
  if(d.theme!==undefined){
    S.theme = S.theme==="dark" ? "light" : "dark";
    save("theme",S.theme); render(); return; }
  if(d.hf){ S.homeFilter=d.hf; render(); return; }
  if(d.grp!==undefined){ S.grouped=!S.grouped; render(); return; }

  if(d.smart!==undefined){ M={sms:"",err:"",batch:null}; render(); return; }
  if(d.new!==undefined){ M=newTxState(); render(); return; }
  if(d.edit){ var t=S.tx.filter(function(x){return x.id===d.edit;})[0];
    if(t){ M=newTxState(t); M.editId=t.id; } render(); return; }
  if(d.del){
    var gone=null;
    S.tx=S.tx.filter(function(x){ if(x.id===d.del){ gone=x; return false; } return true; });
    if(gone){
      LAST_DEL=gone;
      save("transactions",S.tx);
      if(UNDO_TIMER) clearTimeout(UNDO_TIMER);
      UNDO_TIMER=setTimeout(function(){ LAST_DEL=null; render(); }, 6000);
      render();
    }
    return; }

  // tx modal
  if(d.mtype){ syncTx(); M.type=d.mtype;
    var L=d.mtype==="income"?S.icats:S.ecats; M.cat=L[0]?L[0].key:""; repaintSheet(); return; }
  if(d.macc){ M.acc=d.macc; repaintSheet(); return; }
  if(d.mcat){ M.cat=d.mcat; repaintSheet(); return; }
  if(d.mfrom!==undefined){ M.from=d.mfrom; repaintSheet(); return; }
  if(d.mto!==undefined){ M.to=d.mto; repaintSheet(); return; }
  if(d.mrep!==undefined){ syncTx(); M.rep=!M.rep; repaintSheet(); return; }
  if(d.editcats){ syncTx();
    M={kind:d.editcats,list:(d.editcats==="income"?S.icats:S.ecats).slice(),edit:null,back:M};
    render(); return; }

  // 정산
  if(d.stlopen!==undefined){
    syncTx();
    var tot0=amtEval(M.amount)||0;
    var had0=M.stlData;
    M={stl:true, stlTotal:tot0,
       mine: had0?String(had0.mine):"", got: had0?String(had0.got):"",
       tmine: !!had0, tgot: !!had0,
       sacc: had0?had0.accountId:stlDefaultAcc(), back:M};
    render(); return; }
  if(d.stlclear!==undefined){ syncTx(); M.stlData=null; repaintSheet(); return; }
  if(d.stlacc){ syncStl(); M.sacc=d.stlacc; repaintSheet(); return; }
  if(d.stlsave!==undefined){
    syncStl();
    var tot1=stlTotal(), mine1=stlNum(M.mine), got1=stlNum(M.got);
    if(!mine1 && got1) mine1=Math.max(0,tot1-got1);
    if(!got1 && mine1) got1=Math.max(0,tot1-mine1);
    if(mine1<0 || got1<0 || !M.sacc) return;
    var par=M.back; if(!par) { M=null; render(); return; }
    par.stlData={mine:mine1, got:got1, accountId:M.sacc};
    M=par; render(); return; }

  // smart
  if(d.smsgo!==undefined){
    var raw=(document.getElementById("sms")||{}).value||"";
    var chunks=splitSms(raw);
    if(chunks.length>1){
      var many=chunks.map(parseSms).filter(Boolean).map(function(p){ p._use=true; return p; });
      if(!many.length){ M.err="금액을 찾지 못했어요. 문자 전체를 붙여넣어 주세요."; M.sms=raw; render(); return; }
      M.batch=many; render(); return;
    }
    var one=parseSms(raw);
    if(!one){ M.err="금액을 찾지 못했어요. 문자 전체를 붙여넣어 주세요."; M.sms=raw; render(); return; }
    M=newTxState(one); M.pre=true; render(); return;
  }
  if(d.bt){ var i2=+d.bt; M.batch[i2]._use=!M.batch[i2]._use; repaintSheet(); return; }
  if(d.bedit){
    var bi=+d.bedit, item=M.batch[bi];
    var st=newTxState(item); st.pre=true; st.batchFrom={list:M.batch,idx:bi};
    M=st; render(); return; }
  if(d.bback!==undefined){ M.batch=null; M.err=""; render(); return; }
  if(d.bsave!==undefined){
    M.batch.filter(function(b){return b._use;}).forEach(function(b){
      S.tx.push({id:uid(),type:b.type,category:b.category,amount:b.amount,memo:b.memo,date:b.date,accountId:b.accountId}); });
    save("transactions",S.tx); M=null; render(); return;
  }

  // assets
  if(d.accopen){
    S.openAcc = S.openAcc===d.accopen ? null : d.accopen;
    S.accMOff = 0;          // 열 때마다 이번 달부터
    render(); return; }
  if(d.hidetot!==undefined){ S.hideTotal=!S.hideTotal; save("hideTotal",S.hideTotal); render(); return; }
  if(d.accmon){ S.accMOff += parseInt(d.accmon,10); render(); return; }
  if(d.acc==="new"){ M={atype:"cash",name:"",init:"",baseDelta:0,link:"",mat:"",mon:"",day:"",
    cycle:"prev",cycleDay:"",editId:null}; render(); return; }
  if(d.accedit){ var a=accById(d.accedit);
    if(a){
      var bNow=balances();
      // 화면에 보이는 현재 금액 (신용카드는 미결제액)
      var shownNow = linkedCheck(a) ? 0
        : isCredit(a) ? -(bNow[a.id]||0) : (bNow[a.id]||0);
      // 기록 때문에 생긴 변동분 — 저장할 때 다시 빼줍니다
      var delta = shownNow - a.initial;
      M={atype:a.type,name:a.name,init:String(shownNow),baseDelta:delta,link:a.linkedAccountId||"",
      mat:a.maturity||"",mon:a.monthly?String(a.monthly):"",day:a.payDay?String(a.payDay):"",
      cycle:a.cycle||"prev", cycleDay:a.cycleDay?String(a.cycleDay):"", editId:a.id};
    }
    render(); return; }
  if(d.accdel){ if(confirm("이 자산을 지울까요? 관련 이체 기록도 함께 지워져요.")){
      S.acc=S.acc.filter(function(x){return x.id!==d.accdel;}).map(function(x){
        return x.linkedAccountId===d.accdel?Object.assign({},x,{linkedAccountId:""}):x; });
      S.tx=S.tx.filter(function(x){ return !(x.type==="transfer"&&(x.fromAccountId===d.accdel||x.toAccountId===d.accdel)); })
        .map(function(x){ return x.accountId===d.accdel?Object.assign({},x,{accountId:""}):x; });
      // 이체 반복은 상대가 없으면 성립하지 않으니 제거하고,
      // 일반 반복은 계좌만 비워 남겨둡니다 (다시 고르면 계속 쓸 수 있게)
      S.rec=S.rec.filter(function(r){ return !(r.type==="transfer"&&(r.fromAccountId===d.accdel||r.toAccountId===d.accdel)); })
        .map(function(r){ return r.accountId===d.accdel?Object.assign({},r,{accountId:""}):r; });
      saveAll(); render(); } return; }
  if(d.carddisc){
    var dp=d.carddisc.split("|"), cid=dp[0], amt=parseInt(dp[1],10)||0;
    if(!amt) return;
    if(!confirm(won(amt)+"원을 할인·캐시백으로 기록할까요?\n카드 미결제액에서 빠집니다.")) return;
    var inc=S.icats[S.icats.length-1] || S.icats[0];
    S.tx.push({id:uid(), type:"income", category:inc?inc.key:"etc_income", amount:amt,
      memo:"카드 할인", note:"", date:today(), accountId:cid});
    save("transactions", S.tx);
    render(); return; }
  if(d.paycard){
    var pc=String(d.paycard).split("|");
    var card=accById(pc[0]);
    var usePrev = pc[1]==="prev";
    if(card){
      var due2 = card.payDay
        ? (usePrev ? prevPayDate(card.payDay) : nextPayDate(card.payDay))
        : today();
      var owe = card.payDay ? billedAmount(card, due2) : -(balances()[card.id]||0);
      var src=S.acc.filter(function(x){ return ["cash","savings","installment"].indexOf(x.type)>=0; })[0];
      var st=newTxState();
      st.type="transfer";
      st.amount=owe>0?String(owe):"";
      st.from=src?src.id:"";
      st.to=card.id;
      st.date=due2 || today();   // 지난 청구분이면 그 결제일로
      st.memo=card.name+" 결제";
      M=st; render();
    }
    return; }
  if(d.accmv){ var pp=d.accmv.split("|"), ix=-1;
    S.acc.forEach(function(x,n){ if(x.id===pp[0]) ix=n; });
    var jx=ix+parseInt(pp[1],10);
    if(ix>=0&&jx>=0&&jx<S.acc.length){ var tmp2=S.acc[ix]; S.acc[ix]=S.acc[jx]; S.acc[jx]=tmp2;
      save("accounts",S.acc); render(); } return; }
  if(d.atype){ syncAcc(); M.atype=d.atype; repaintSheet(); return; }
  if(d.alink!==undefined){ syncAcc(); M.link=d.alink; repaintSheet(); return; }
  if(d.acyc){ syncAcc(); M.cycle=d.acyc;
    if(d.acyc==="mid" && !M.cycleDay) M.cycleDay="15";
    repaintSheet(); return; }
  if(d.asave!==undefined){ commitAcc(); return; }
  if(d.recur!==undefined){ M={recur:true, back:{settings:true}}; render(); return; }
  if(d.rnew!==undefined){
    var first=S.ecats[0];
    M={rec:{id:uid(), type:"expense", category:first?first.key:"", amount:0, memo:"",
            accountId:(accByRecent()[0]||{}).id||"", day:1,
            startMonth:today().slice(0,7), active:true, generatedMonths:[]},
       isNew:true, back:{recur:true, back:{settings:true}}};
    render(); return; }
  if(d.redit){
    var target=S.rec.filter(function(r){ return r.id===d.redit; })[0];
    if(target) M={rec:clone(target), back:{recur:true, back:{settings:true}}};
    render(); return; }
  if(d.rtogm!==undefined){ syncRec(); M.rec.active=!M.rec.active; repaintSheet(); return; }
  if(d.rtype){ syncRec(); M.rec.type=d.rtype;
    var L=d.rtype==="income"?S.icats:S.ecats;
    if(d.rtype!=="transfer") M.rec.category=L[0]?L[0].key:"";
    repaintSheet(); return; }
  if(d.rcat){ syncRec(); M.rec.category=d.rcat; repaintSheet(); return; }
  if(d.racc){ syncRec(); M.rec.accountId=d.racc; repaintSheet(); return; }
  if(d.rfrom){ syncRec(); M.rec.fromAccountId=d.rfrom; repaintSheet(); return; }
  if(d.rto){ syncRec(); M.rec.toAccountId=d.rto; repaintSheet(); return; }
  if(d.rsave!==undefined){
    syncRec();
    var rr=M.rec;
    if(!rr.amount || rr.amount<1) return;
    if(M.isNew) S.rec.push(rr);
    else S.rec=S.rec.map(function(x){ return x.id===rr.id ? rr : x; });
    save("recurring", S.rec);
    M=M.back||null; render(); return; }
  if(d.rtog){ S.rec.forEach(function(r){ if(r.id===d.rtog) r.active=!r.active; });
    save("recurring",S.rec); render(); return; }
  if(d.rdel){ if(confirm("이 반복 거래를 지울까요? 이미 기록된 내역은 남아요.")){
    S.rec=S.rec.filter(function(r){return r.id!==d.rdel;}); save("recurring",S.rec); render(); } return; }

  if(d.op){
    var f=document.getElementById("amt");
    var cur = amtClean(f ? f.value : M.amount);
    if(d.op==="bs") cur = cur.slice(0, -1);
    else if(d.op==="="){
      var r = amtEval(cur);                  // 결과를 확정하고 이어서 계산할 수 있게
      if(r===null) return;
      cur = String(r);
    }
    else{
      if(!cur) return;                       // 빈 칸에서 연산자만 넣지 않습니다
      cur = cur.replace(/[+\-*/]$/, "");      // 연산자 연달아 쓰면 교체
      cur += d.op;
    }
    M.amount = cur;
    if(f){
      f.value = amtHasOp() ? cur : (cur ? Number(cur).toLocaleString("ko-KR") : "");
      try{ f.focus(); f.setSelectionRange(f.value.length, f.value.length); }catch(e){}
    }
    var sb=document.getElementById("amtsub");
    if(sb) sb.innerHTML=amtSubHtml();
    var sv=document.getElementById("save");
    if(sv){ var bad2=M.type==="transfer"&&(!M.from||!M.to||M.from===M.to);
      sv.disabled = !amtEval(cur) || bad2; }
    return; }
  if(d.quick!==undefined){
    var r=(M._recent||[])[+d.quick];
    if(r){
      syncTx();
      M.amount=String(r.amount); M.memo=r.memo; M.note=r.note||"";
      if(r.type==="transfer"){
        if(r.fromAccountId) M.from=r.fromAccountId;
        if(r.toAccountId) M.to=r.toAccountId;
      } else {
        M.cat=r.category;
        if(r.accountId) M.acc=r.accountId;
      }
      repaintSheet();
    }
    return; }
  if(d.search!==undefined){ M={ftype:"all",fcat:"",q:"",per:"all",from:"",to:""}; render(); return; }
  if(d.fper){
    syncSearch();
    M.per=d.fper;
    if(d.fper==="custom" && !M.from && !M.to){
      var n=new Date(today()+"T00:00:00");
      M.from=n.getFullYear()+"-"+pad(n.getMonth()+1)+"-01";
      M.to=today();
    }
    repaintSheet(); return; }
  if(d.tag){ M={tag:d.tag,back:M}; render(); return; }
  if(d.catdet){ M={catKey:d.catdet, mOff:S.period==="year"?0:S.mOff}; render(); return; }
  if(d.catmon){ M.mOff += parseInt(d.catmon,10); repaintSheet(); return; }
  if(d.catgo!==undefined){ M.mOff = parseInt(d.catgo,10); repaintSheet(); return; }
  if(d.fty){ syncSearch(); M.ftype=d.fty; M.fcat=""; repaintSheet(); return; }
  if(d.fcat!==undefined){ syncSearch(); M.fcat=d.fcat; repaintSheet(); return; }
  if(d.budget!==undefined){ M={vals:Object.assign({},S.budgets),back:M&&M.settings?{settings:true}:null}; render(); return; }
  if(d.bsaveall!==undefined){
    syncBudget();
    var out={};
    Object.keys(M.vals).forEach(function(k){ var v=parseInt(M.vals[k],10); if(v>0) out[k]=v; });
    S.budgets=out; save("budgets",S.budgets); M=(M&&M.back)||null; render(); return; }

  // settings
  if(d.cats){ M={kind:d.cats,list:(d.cats==="income"?S.icats:S.ecats).slice(),edit:null,
    back:M&&M.settings?{settings:true}:null}; render(); return; }
  if(d.exp!==undefined){ doExport(); return; }
  if(d.wipetx!==undefined){
    if(!confirm("거래 기록을 모두 지울까요?\n자산과 분류는 그대로 남아요.\n되돌릴 수 없어요.")) return;
    S.tx=[]; S.rec=[];
    save("transactions",S.tx); save("recurring",S.rec);
    LAST_DEL=null; M=null; S.openAcc=null; render();
    alert("거래 기록을 지웠어요.");
    return; }
  if(d.wipeall!==undefined){
    if(!confirm("모든 내용을 지우고 처음 상태로 되돌릴까요?\n기록·자산·분류·예산이 전부 사라져요.\n되돌릴 수 없어요.")) return;
    if(!confirm("정말 지울까요? 마지막 확인이에요.")) return;
    S.tx=[]; S.acc=[]; S.rec=[]; S.budgets={};
    S.ecats=clone(DEF_EXP); S.icats=clone(DEF_INC);
    saveAll(); save("budgets",S.budgets);
    LAST_DEL=null; M=null; S.openAcc=null; S.grouped=false; S.mOff=0; S.yOff=0; render();
    alert("처음 상태로 되돌렸어요.");
    return; }
  if(d.copybk!==undefined){
    var ta=document.getElementById("bkt");
    if(ta){
      try{ ta.removeAttribute("readonly"); ta.select(); ta.setSelectionRange(0,999999); }catch(e){}
      var done=false;
      try{ done=document.execCommand("copy"); }catch(e){}
      try{ if(navigator.clipboard && !done){ navigator.clipboard.writeText(M.backupText); done=true; } }catch(e){}
      try{ ta.setAttribute("readonly","readonly"); }catch(e){}
      M.copied=done; render();
    }
    return; }
  if(d.imp!==undefined){ var f=document.getElementById("impf"); if(f) f.click(); return; }

  // category manager
  if(d.cnew!==undefined){ M.edit={key:null,label:"",icon:"dots",color:SW[0]}; render(); return; }
  if(d.cedit){ M.edit=Object.assign({},M.list[+d.cedit]); render(); return; }
  if(d.cdel){ M.list.splice(+d.cdel,1); render(); return; }
  if(d.cmv){ var q=d.cmv.split("|"), a1=+q[0], b1=a1+parseInt(q[1],10), lastI=M.list.length-1;
    if(a1<lastI&&b1>=0&&b1<=lastI-1){ var s1=M.list[a1]; M.list[a1]=M.list[b1]; M.list[b1]=s1; repaintSheet(); } return; }
  if(d.cicon){ syncCat(); M.edit.icon=d.cicon; repaintSheet(); return; }
  if(d.ccol){ syncCat(); M.edit.color=decodeURIComponent(d.ccol); repaintSheet(); return; }
  if(d.ccommit!==undefined){ syncCat();
    if(!M.edit.label.trim()) return;
    if(M.edit.key){ M.list=M.list.map(function(c){ return c.key===M.edit.key?
      {key:c.key,label:M.edit.label.trim(),icon:M.edit.icon,color:M.edit.color}:c; }); }
    else { M.list.splice(M.list.length-1,0,{key:uid(),label:M.edit.label.trim(),icon:M.edit.icon,color:M.edit.color}); }
    M.edit=null; render(); return; }
  if(d.csave!==undefined){
    var keys=M.list.map(function(c){return c.key;}), fb=keys[keys.length-1], kind=M.kind;
    if(kind==="income") S.icats=M.list; else S.ecats=M.list;
    S.tx=S.tx.map(function(x){ return (x.type===kind&&keys.indexOf(x.category)<0)?Object.assign({},x,{category:fb}):x; });
    S.rec=S.rec.map(function(r){ return (r.type===kind&&keys.indexOf(r.category)<0)?Object.assign({},r,{category:fb}):r; });
    saveAll();
    var back=M.back||null;
    if(back && back.type===kind && keys.indexOf(back.cat)<0) back.cat=fb;
    M=back; render(); return; }
});

function newTxState(seed){
  var s=seed||null;
  return {
    type:s?s.type:"expense",
    cat:s?s.category:(S.ecats[0]?S.ecats[0].key:""),
    amount:s?String(s.amount):"",
    memo:s?(s.memo||""):"",
    note:s?(s.note||""):"",
    date:s?s.date:today(),
    acc:s&&s.accountId?s.accountId:(S.acc[0]?S.acc[0].id:""),
    from:s&&s.fromAccountId?s.fromAccountId:(S.acc[0]?S.acc[0].id:""),
    to:s&&s.toAccountId?s.toAccountId:"",
    stlData: s && s.settle ? {mine:s.settle.mine, got:s.settle.got, accountId:s.settle.accountId} : null,
    rep: s ? !!s.recurringId : false,
    recurringId: s ? (s.recurringId||null) : null,
    editId:null, pre:false
  };
}
function commitTx(){
  syncTx();
  var n = amtEval(M.amount);
  if(!n||n<=0) return;
  var isT=M.type==="transfer";
  if(isT&&(!M.from||!M.to||M.from===M.to)) return;
  var rec=M.editId?S.tx.filter(function(x){return x.id===M.editId;})[0]:null;
  var o={id:M.editId||uid(),type:M.type,amount:n,memo:M.memo.trim(),note:(M.note||"").trim(),date:M.date};
  if(rec&&rec.recurringId) o.recurringId=rec.recurringId;
  if(isT){ o.fromAccountId=M.from; o.toAccountId=M.to; }
  else { o.category=M.cat; o.accountId=M.acc; }
  if(!isT && M.type==="expense" && M.stlData && M.stlData.mine>=0){
    var sd=M.stlData;
    o.settle={mine:Math.min(sd.mine,n), got:sd.got, accountId:sd.accountId};
  }
  var fromBatch=M.batchFrom;
  function makeRec(){
    var r={id:uid(),type:M.type,amount:n,memo:M.memo.trim(),day:+M.date.slice(8,10),
      startMonth:M.date.slice(0,7),active:true,generatedMonths:[M.date.slice(0,7)]};
    if(isT){ r.fromAccountId=M.from; r.toAccountId=M.to; } else { r.category=M.cat; r.accountId=M.acc; }
    return r;
  }
  if(M.editId){
    S.tx=S.tx.map(function(x){ return x.id===M.editId?o:x; });
    var had=S.rec.filter(function(r){ return r.id===M.recurringId; })[0];
    if(M.rep && !had){                       // 수정하면서 반복을 켠 경우
      var nr=makeRec(); o.recurringId=nr.id;
      S.rec.push(nr); save("recurring",S.rec);
    } else if(!M.rep && had){                // 반복을 끈 경우
      S.rec=S.rec.filter(function(r){ return r.id!==M.recurringId; });
      delete o.recurringId; save("recurring",S.rec);
    } else if(M.rep && had){                 // 켜진 채로 내용이 바뀐 경우 함께 반영
      had.amount=n; had.memo=M.memo.trim(); had.day=+M.date.slice(8,10);
      if(isT){ had.fromAccountId=M.from; had.toAccountId=M.to; }
      else { had.category=M.cat; had.accountId=M.acc; }
      save("recurring",S.rec);
    }
  }
  else{
    S.tx.push(o);
    if(M.rep){
      var r2=makeRec(); o.recurringId=r2.id;
      S.rec.push(r2); save("recurring",S.rec);
    }
  }
  save("transactions",S.tx);
  if(fromBatch){
    var rest=fromBatch.list.filter(function(_,i){ return i!==fromBatch.idx; });
    M = rest.length ? {sms:"",err:"",batch:rest} : null;
  } else M=null;
  render();
}
function commitAcc(){
  syncAcc();
  if(!M.name.trim()) return;
  var link=M.atype==="check_card"?M.link:"";
  // 입력한 값은 "지금 금액"이므로, 기록으로 생긴 변동분을 빼야 시작 금액이 됩니다
  var typed = parseInt(M.init,10)||0;
  var startAmt = link ? 0 : typed - (M.baseDelta||0);
  var payload={name:M.name.trim(),type:M.atype,initial:startAmt,linkedAccountId:link,
    maturity:M.atype==="installment"?(M.mat||""):"",
    monthly:M.atype==="installment"?(parseInt(M.mon,10)||0):0,
    payDay:M.atype==="credit_card"?(parseInt(M.day,10)||0):0,
    cycle:M.atype==="credit_card"?(M.cycle||"prev"):"",
    cycleDay:M.atype==="credit_card"?(parseInt(M.cycleDay,10)||0):0};
  if(M.editId) S.acc=S.acc.map(function(a){ return a.id===M.editId?Object.assign({},a,payload):a; });
  else S.acc.push(Object.assign({id:uid()},payload));
  save("accounts",S.acc); M=null; render();
}

/* ---------- backup ---------- */
function doExport(){
  var payload={app:"worth",version:1,exportedAt:new Date().toISOString(),
    transactions:S.tx,accounts:S.acc,recurring:S.rec,expenseCats:S.ecats,incomeCats:S.icats,budgets:S.budgets};
  var txt=JSON.stringify(payload);
  var name="worth-backup-"+today()+".json";

  // 1) iOS 홈화면 앱에서는 다운로드가 막히므로 공유 시트를 먼저 시도
  try{
    if(navigator.share && navigator.canShare){
      var f=new File([txt],name,{type:"application/json"});
      if(navigator.canShare({files:[f]})){
        navigator.share({files:[f],title:"₩orth 백업"}).catch(function(){});
        return;
      }
    }
  }catch(e){}

  // 2) 일반 브라우저: 파일로 저장
  try{
    var blob=new Blob([txt],{type:"application/json"});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");
    a.href=url; a.download=name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); },1000);
    return;
  }catch(e){}

  // 3) 둘 다 막히면 앱 안에서 직접 복사할 수 있게
  M={backupText:txt}; render();
}
function doImport(file){
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var d=JSON.parse(fr.result);
      if(!d||!(d.transactions instanceof Array)||!(d.accounts instanceof Array)){
        alert("이 파일은 ₩orth 백업 파일이 아닌 것 같아요."); return; }
      if(!confirm("거래 "+d.transactions.length+"건을 불러올까요?\n지금 기록은 지워지고 백업 내용으로 바뀝니다.")) return;
      S.tx=d.transactions; S.acc=d.accounts; S.rec=d.recurring||[];
      if(d.expenseCats&&d.expenseCats.length) S.ecats=d.expenseCats;
      if(d.incomeCats&&d.incomeCats.length) S.icats=d.incomeCats;
      if(d.budgets && typeof d.budgets==="object") { S.budgets=d.budgets; save("budgets",S.budgets); }
      saveAll(); M=null; render(); alert("불러오기가 끝났어요.");
    }catch(e){ alert("파일을 읽지 못했어요."); }
  };
  fr.readAsText(file);
}

  return { kind: p[0], key: p[1] };
}

// 드래그 중에는 화면을 다시 그리지 않고, 실제 요소만 자리바꿈합니다.
// (다시 그리면 잡고 있던 손잡이가 사라져 드래그가 끊깁니다)
function dragRowOf(handle) {
  if (!handle || !handle.closest) return null;
  return DRAG && DRAG.kind === "acc" ? handle.closest(".acc") : handle.closest(".brow");
}

function dragBegin(h) {
  var d = dragParse(h);
  if (!d) return false;
  if (d.kind === "acc" && S.grouped) return false;   // 종류별 보기에선 순서 개념 없음
  var row = h.closest ? (d.kind === "acc" ? h.closest(".acc") : h.closest(".brow")) : null;
  if (!row) return false;
  DRAG = { kind: d.kind, key: d.key, row: row };
  if (row.classList && row.classList.add) row.classList.add("dragging");
  return true;
}

function dragOver(h) {
  if (!DRAG || !h) return;
  var d = dragParse(h);
  if (!d || d.kind !== DRAG.kind || d.key === DRAG.key) return;
  var over = dragRowOf(h);
  var row = DRAG.row;
  if (!over || !row || over === row) return;

  var parent = row.parentNode;
  if (!parent || over.parentNode !== parent) return;

  // 분류 목록에서 맨 아래 기본 분류는 자리를 지킵니다
  if (DRAG.kind === "cat") {
    var brows = parent.querySelectorAll(".brow");
    if (brows.length && over === brows[brows.length - 1]) return;
  }

  // 표준 DOM 방식으로 실제 위치를 옮깁니다
  var kids = Array.prototype.slice.call(parent.children);
  var iFrom = kids.indexOf(row), iTo = kids.indexOf(over);
  if (iFrom < 0 || iTo < 0) return;
  if (iFrom < iTo) parent.insertBefore(row, over.nextSibling);
  else parent.insertBefore(row, over);
  DRAG.moved = true;
}

// 놓았을 때 화면 순서를 읽어 데이터에 반영합니다
function dragEnd() {
  if (!DRAG) return;
  var d = DRAG; DRAG = null;
  if (d.row && d.row.classList) d.row.classList.remove("dragging");
  if (!d.moved) return;

  var parent = d.row.parentNode;
  if (!parent) return;
  var order = [];
  var kids = Array.prototype.slice.call(parent.children);
  kids.forEach(function (n) {
    if (!n.querySelector) return;
    var hh = n.querySelector("[data-drag]");
    if (hh) order.push(dragParse(hh).key);
  });
  if (!order.length) return;

  if (d.kind === "acc") {
    var byId = {};
    S.acc.forEach(function (a) { byId[a.id] = a; });
    var next = [];
    order.forEach(function (id) { if (byId[id]) { next.push(byId[id]); delete byId[id]; } });
    S.acc.forEach(function (a) { if (byId[a.id]) next.push(a); });
    S.acc = next;
    save("accounts", S.acc);
    render();
  } else if (M && M.list) {
    var old = M.list.slice();
    var next2 = [];
    order.forEach(function (i) { var it = old[parseInt(i, 10)]; if (it && next2.indexOf(it) < 0) next2.push(it); });
    old.forEach(function (it) { if (next2.indexOf(it) < 0) next2.push(it); });
    M.list = next2;
    repaintSheet();
  }
}

document.addEventListener("touchstart", function (e) {
  var t = e.target.closest && e.target.closest("[data-drag]");
  if (!t) return;
  if (dragBegin(t)) e.preventDefault();
}, { passive: false });

document.addEventListener("touchmove", function (e) {
  if (!DRAG || !e.touches || !e.touches[0]) return;
  e.preventDefault();
  if (!document.elementFromPoint) return;
  var el = document.elementFromPoint(e.touches[0].clientX, e.touches[0].clientY);
  var h = el && el.closest ? el.closest("[data-drag]") : null;
  if (h) dragOver(h);
}, { passive: false });

document.addEventListener("touchend", function () { dragEnd(); });
document.addEventListener("touchcancel", function () { dragEnd(); });

// 마우스로도 (PC 확인용)
document.addEventListener("mousedown", function (e) {
  var t = e.target.closest && e.target.closest("[data-drag]");
  if (t && dragBegin(t)) e.preventDefault();
});
document.addEventListener("mousemove", function (e) {
  if (!DRAG || !document.elementFromPoint) return;
  var el = document.elementFromPoint(e.clientX, e.clientY);
  var h = el && el.closest ? el.closest("[data-drag]") : null;
  if (h) dragOver(h);
});
document.addEventListener("mouseup", function () { dragEnd(); });

/* ---------- 옆으로 밀어 삭제 ---------- */
var SWIPE_OPEN = null;   // 열려 있는 줄의 id
var SWIPE = null;           // 진행 중인 스와이프

function swRowOf(el) {
  return el && el.closest ? el.closest("[data-sw]") : null;
}
function swInner(wrap) {
  return wrap && wrap.querySelector ? wrap.querySelector(".tx") : null;
}
function swSetX(inner, x) {
  if (!inner) return;
  inner.style.transform = x ? "translateX(" + x + "px)" : "";
}
function swCloseAll() {
  if (SWIPE_OPEN === null) return;
  SWIPE_OPEN = null;
  var list = document.querySelectorAll ? document.querySelectorAll(".tx") : [];
  for (var i = 0; i < list.length; i++) {
    if (list[i].classList && list[i].classList.remove) list[i].classList.remove("swopen");
    swSetX(list[i], 0);
  }
}

document.addEventListener("touchstart", function (e) {
  if (DRAG) return;
  var wrap = swRowOf(e.target);
  if (!wrap || !e.touches || !e.touches[0]) return;
  // 삭제 버튼 자체를 누른 경우는 클릭으로 처리
  if (e.target.closest && e.target.closest(".swdel")) return;
  var id = wrap.getAttribute("data-sw");
  SWIPE = {
    id: id, wrap: wrap, inner: swInner(wrap),
    x0: e.touches[0].clientX, y0: e.touches[0].clientY,
    base: (SWIPE_OPEN === id ? -84 : 0),
    axis: null
  };
}, { passive: true });

document.addEventListener("touchmove", function (e) {
  if (!SWIPE || DRAG || !e.touches || !e.touches[0]) return;
  var dx = e.touches[0].clientX - SWIPE.x0;
  var dy = e.touches[0].clientY - SWIPE.y0;

  if (!SWIPE.axis) {
    if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
    SWIPE.axis = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
    if (SWIPE.axis === "x" && SWIPE.inner && SWIPE.inner.classList && SWIPE.inner.classList.add)
      SWIPE.inner.classList.add("swdrag");
  }
  if (SWIPE.axis !== "x") return;      // 위아래로 움직이면 그냥 스크롤

  e.preventDefault();
  var x = SWIPE.base + dx;
  if (x > 0) x = 0;                  // 오른쪽으로는 안 열림
  if (x < -110) x = -110;            // 너무 많이 끌리지 않게
  swSetX(SWIPE.inner, x);
  SWIPE.last = x;
}, { passive: false });

document.addEventListener("touchend", function () {
  if (!SWIPE) return;
  var s = SWIPE; SWIPE = null;
  if (s.axis !== "x") return;
  if (s.inner && s.inner.classList && s.inner.classList.remove) s.inner.classList.remove("swdrag");
  var x = (s.last === undefined ? s.base : s.last);
  if (x < -42) {                     // 절반 넘게 밀면 열어둠
    SWIPE_OPEN = s.id;
    if (s.inner.classList && s.inner.classList.add) s.inner.classList.add("swopen");
    swSetX(s.inner, 0);              // transform 은 클래스가 담당
  } else {
    SWIPE_OPEN = null;
    if (s.inner.classList && s.inner.classList.remove) s.inner.classList.remove("swopen");
    swSetX(s.inner, 0);
  }
});
document.addEventListener("touchcancel", function () {
  if (SWIPE && SWIPE.inner && SWIPE.inner.classList && SWIPE.inner.classList.remove) {
    SWIPE.inner.classList.remove("swdrag");
    swSetX(SWIPE.inner, 0);
  }
  SWIPE = null;
});

</script>
</body>
